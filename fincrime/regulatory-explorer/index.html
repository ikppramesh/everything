<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regulatory Explorer — FinCrime | Everything</title>
<style>
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#4b5563; --accent2:#1d4ed8;
  --nav-h:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden;}

/* ---- NAV ---- */
#nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:1000;}
#nav a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .15s;}
#nav a:hover{color:var(--text);}
#nav .sep{color:var(--border);font-size:16px;}
#nav .title{font-weight:600;font-size:14px;color:var(--text);}
#nav .badge{background:#1e3a5f;color:#58a6ff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.3px;}

/* ---- LAYOUT ---- */
#layout{display:flex;height:calc(100vh - var(--nav-h));margin-top:var(--nav-h);overflow:hidden;}

/* ---- SIDEBAR ---- */
#sidebar{width:240px;min-width:240px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;}
#sidebar-header{padding:14px 14px 10px;border-bottom:1px solid var(--border);}
#sidebar-header h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
#sidebar-search{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12px;margin-top:8px;outline:none;}
#sidebar-search::placeholder{color:var(--muted);}
#sidebar-search:focus{border-color:#58a6ff;}
#nav-tree{padding:8px 0;flex:1;}
.framework-group{margin-bottom:2px;}
.framework-toggle{width:100%;background:none;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;font-weight:500;text-align:left;transition:background .1s;}
.framework-toggle:hover{background:var(--bg3);}
.framework-toggle .fw-icon{font-size:15px;width:18px;text-align:center;}
.framework-toggle .fw-label{flex:1;}
.framework-toggle .fw-jur{font-size:10px;color:var(--muted);background:var(--bg3);padding:1px 5px;border-radius:3px;}
.framework-toggle .chevron{color:var(--muted);font-size:10px;transition:transform .2s;}
.framework-toggle.open .chevron{transform:rotate(90deg);}
.section-list{display:none;padding-left:0;}
.section-list.open{display:block;}
.section-item{display:flex;align-items:flex-start;gap:6px;padding:6px 14px 6px 34px;cursor:pointer;font-size:12px;color:var(--muted);transition:background .1s, color .1s;border-left:2px solid transparent;line-height:1.4;}
.section-item:hover{background:var(--bg3);color:var(--text);}
.section-item.active{background:rgba(29,78,216,.15);color:#58a6ff;border-left-color:#1d4ed8;}
.section-item .dot{width:4px;height:4px;border-radius:50%;background:currentColor;margin-top:5px;flex-shrink:0;}

/* ---- MOBILE SIDEBAR DROPDOWN ---- */
#mobile-sidebar-btn{display:none;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 12px;font-size:12px;cursor:pointer;margin:8px 12px;}
#mobile-nav-select{display:none;width:calc(100% - 24px);margin:0 12px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12px;}

/* ---- CENTER ---- */
#center{flex:1;overflow-y:auto;padding:24px;}
#welcome{max-width:720px;margin:0 auto;}
#welcome h1{font-size:22px;font-weight:600;margin-bottom:6px;}
#welcome .sub{color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.6;}
.fw-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.fw-tile{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,transform .1s;}
.fw-tile:hover{border-color:#58a6ff;transform:translateY(-2px);}
.fw-tile .tile-icon{font-size:24px;margin-bottom:8px;}
.fw-tile h4{font-size:13px;font-weight:600;margin-bottom:4px;}
.fw-tile p{font-size:11px;color:var(--muted);line-height:1.5;}
.fw-tile .tile-count{font-size:10px;color:var(--accent2);margin-top:8px;font-weight:500;}

/* ---- REFERENCE CARD ---- */
#ref-card{max-width:720px;margin:0 auto;}
.card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.jur-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.jur-india{background:#1c3f1c;color:#56d364;}
.jur-international{background:#1a3a5c;color:#58a6ff;}
.jur-us{background:#3a1c1c;color:#ff7b72;}
.fw-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--muted);}
.card-title{font-size:18px;font-weight:700;line-height:1.35;margin-bottom:6px;color:var(--text);}
.card-date{font-size:12px;color:var(--muted);margin-bottom:20px;}
.card-section{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;}
.card-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.card-section-text{font-size:13px;line-height:1.7;color:var(--text);}
.penalty-section{background:rgba(255,123,114,.06);border-color:rgba(255,123,114,.25);}
.penalty-section .card-section-label{color:#ff7b72;}
.penalty-icon{display:inline-block;margin-right:6px;}
.enforcement-section{background:rgba(88,166,255,.06);border-color:rgba(88,166,255,.2);}
.enforcement-section .card-section-label{color:#58a6ff;}

/* TOGGLE */
.lang-toggle{display:flex;gap:0;margin-bottom:20px;background:var(--bg3);border-radius:6px;padding:3px;width:fit-content;}
.lang-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:5px 14px;border-radius:4px;font-size:12px;font-weight:500;transition:background .15s,color .15s;}
.lang-btn.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3);}

/* CROSS REFS */
.xref-section{margin-top:20px;}
.xref-section h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px;}
.xref-chips{display:flex;flex-wrap:wrap;gap:8px;}
.xref-chip{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s;}
.xref-chip:hover{border-color:#58a6ff;color:#58a6ff;}

/* ---- RIGHT PANEL ---- */
#right-panel{width:320px;min-width:320px;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;}
#rp-header{padding:14px 14px 12px;border-bottom:1px solid var(--border);}
#rp-header h3{font-size:13px;font-weight:700;margin-bottom:2px;}
#rp-header p{font-size:11px;color:var(--muted);}
#rp-body{padding:14px;flex:1;}

/* Mode toggle */
.mode-toggle{display:flex;gap:0;background:var(--bg3);border-radius:6px;padding:3px;margin-bottom:14px;}
.mode-btn{flex:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:5px 10px;border-radius:4px;font-size:11px;font-weight:600;transition:background .15s,color .15s;text-align:center;}
.mode-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35);}

/* Scenario select */
.scenario-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:6px;}
#scenario-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;font-size:12px;margin-bottom:12px;outline:none;}
#scenario-select:focus{border-color:#58a6ff;}
.scenario-text{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;line-height:1.65;color:var(--text);margin-bottom:14px;}

/* MCQ */
.mcq-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.mcq-opt{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:9px 12px;cursor:pointer;font-size:12px;color:var(--muted);transition:border-color .15s,background .15s;}
.mcq-opt:hover{border-color:#58a6ff;color:var(--text);}
.mcq-opt.correct{background:rgba(86,211,100,.12);border-color:#56d364;color:#56d364;}
.mcq-opt.wrong{background:rgba(255,123,114,.1);border-color:#ff7b72;color:#ff7b72;}
.mcq-opt.disabled{pointer-events:none;opacity:.6;}

/* Analysis card */
.analysis-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;animation:slideDown .25s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.analysis-card h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:8px;}
.law-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.law-badge{background:rgba(29,78,216,.2);border:1px solid rgba(29,78,216,.4);color:#93c5fd;font-size:10px;padding:3px 7px;border-radius:4px;line-height:1.4;}
.obligations-list{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.obligations-list li{display:flex;gap:7px;align-items:flex-start;font-size:11px;line-height:1.5;color:var(--text);}
.obligations-list li::before{content:'✓';color:#56d364;font-size:11px;flex-shrink:0;margin-top:1px;}
.deadline-box{background:rgba(255,166,0,.08);border:1px solid rgba(255,166,0,.25);border-radius:6px;padding:8px 10px;margin-bottom:10px;}
.deadline-box .dl-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#f0a500;margin-bottom:3px;}
.deadline-box p{font-size:11px;color:var(--text);line-height:1.5;}
.penalty-box{background:rgba(255,123,114,.08);border:1px solid rgba(255,123,114,.2);border-radius:6px;padding:8px 10px;}
.penalty-box .pl-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#ff7b72;margin-bottom:3px;}
.penalty-box p{font-size:11px;color:var(--text);line-height:1.5;}

.analyze-btn{width:100%;background:#1d4ed8;border:none;border-radius:6px;color:#fff;padding:9px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.analyze-btn:hover{background:#1e40af;}

/* FATF Map */
#fatf-section{padding:14px;border-top:1px solid var(--border);}
#fatf-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px;}
.fatf-region{margin-bottom:10px;}
.fatf-region-label{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.fatf-chips{display:flex;flex-wrap:wrap;gap:4px;}
.fatf-chip{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500;}
.fatf-grey{background:rgba(150,130,40,.25);color:#e3c060;border:1px solid rgba(200,170,50,.25);}
.fatf-black{background:rgba(200,50,50,.2);color:#ff7b72;border:1px solid rgba(200,50,50,.25);}
.fatf-legend{display:flex;gap:10px;margin-bottom:10px;}
.fatf-legend span{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.fatf-legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;}
.fatf-legend .gl::before{background:rgba(200,170,50,.5);}
.fatf-legend .bl::before{background:rgba(200,50,50,.4);}

/* ---- SCROLLBARS ---- */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ---- RESPONSIVE ---- */
@media(max-width:1100px){
  #right-panel{width:280px;min-width:280px;}
}
@media(max-width:768px){
  #layout{flex-direction:column;height:auto;overflow:visible;}
  #sidebar{width:100%;min-width:unset;height:auto;overflow:visible;border-right:none;border-bottom:1px solid var(--border);}
  #nav-tree{display:none;}
  #mobile-sidebar-btn{display:block;}
  #mobile-nav-select{display:block;}
  #center{overflow-y:visible;padding:16px;}
  #right-panel{width:100%;min-width:unset;border-left:none;border-top:1px solid var(--border);}
}
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a href="../../index.html">&#8592; Everything</a>
  <span class="sep">/</span>
  <span class="title">Regulatory Explorer</span>
  <span class="badge">FinCrime</span>
</nav>

<!-- LAYOUT -->
<div id="layout">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h3>Regulation Navigator</h3>
      <input id="sidebar-search" type="text" placeholder="Search regulations..." oninput="filterTree(this.value)">
    </div>
    <!-- Mobile fallback -->
    <button id="mobile-sidebar-btn" onclick="toggleMobileNav()">Browse Regulations ▾</button>
    <select id="mobile-nav-select" onchange="loadSection(this.value)">
      <option value="">Select a regulation...</option>
    </select>
    <div id="nav-tree"></div>
  </aside>

  <!-- CENTER -->
  <main id="center">
    <div id="content-area"></div>
  </main>

  <!-- RIGHT PANEL -->
  <aside id="right-panel">
    <div id="rp-header">
      <h3>Which Law Applies?</h3>
      <p>Test your regulatory knowledge</p>
    </div>
    <div id="rp-body">
      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-test" onclick="setMode('test')">Test Mode</button>
        <button class="mode-btn" id="btn-ref" onclick="setMode('reference')">Reference Mode</button>
      </div>
      <div class="scenario-label">Scenario</div>
      <select id="scenario-select" onchange="loadScenario()">
        <option value="">Choose a scenario...</option>
      </select>
      <div id="scenario-body"></div>
    </div>
    <div id="fatf-section">
      <h4>FATF Watch List</h4>
      <div class="fatf-legend">
        <span class="gl">Grey List</span>
        <span class="bl">Black List</span>
      </div>
      <div id="fatf-regions"></div>
    </div>
  </aside>

</div>

/* ================================================================
   CROSS-REF LABEL LOOKUP
================================================================ */
function getSectionLabel(id) {
  for (const fw of Object.values(REGULATIONS)) {
    const s = fw.sections.find(x => x.id === id);
    if (s) return s.label;
  }
  return id;
}

/* ================================================================
   BUILD SIDEBAR TREE
================================================================ */
function buildTree() {
  const tree = document.getElementById('nav-tree');
  const mobileSelect = document.getElementById('mobile-nav-select');
  tree.innerHTML = '';
  for (const [fwKey, fw] of Object.entries(REGULATIONS)) {
    const jurClass = fw.jurisdiction === 'India' ? 'jur-india' : fw.jurisdiction === 'United States' ? 'jur-us' : 'jur-international';
    const group = document.createElement('div');
    group.className = 'framework-group';
    group.dataset.fw = fwKey;
    const btn = document.createElement('button');
    btn.className = 'framework-toggle';
    btn.innerHTML = `<span class="fw-icon">${fw.icon}</span><span class="fw-label">${fw.label}</span><span class="fw-jur">${fw.jurisdiction}</span><span class="chevron">▶</span>`;
    btn.onclick = () => toggleFramework(fwKey);
    const list = document.createElement('ul');
    list.className = 'section-list';
    list.id = `fw-list-${fwKey}`;
    fw.sections.forEach(sec => {
      const li = document.createElement('li');
      li.className = 'section-item';
      li.id = `nav-${sec.id}`;
      li.dataset.sectionId = sec.id;
      li.dataset.label = sec.label.toLowerCase();
      li.innerHTML = `<span class="dot"></span>${sec.label}`;
      li.onclick = () => loadSection(sec.id);
      list.appendChild(li);
      // Mobile select
      const opt = document.createElement('option');
      opt.value = sec.id;
      opt.textContent = `${fw.label} — ${sec.label}`;
      mobileSelect.appendChild(opt);
    });
    group.appendChild(btn);
    group.appendChild(list);
    tree.appendChild(group);
  }
}

function toggleFramework(fwKey, forceOpen) {
  const list = document.getElementById(`fw-list-${fwKey}`);
  const btn = list.previousElementSibling;
  const isOpen = list.classList.contains('open');
  if (forceOpen !== undefined) {
    if (forceOpen) { list.classList.add('open'); btn.classList.add('open'); }
    else { list.classList.remove('open'); btn.classList.remove('open'); }
  } else {
    list.classList.toggle('open');
    btn.classList.toggle('open');
  }
}

/* ================================================================
   LOAD SECTION
================================================================ */
let currentLang = 'plain'; // 'plain' or 'legal'

function loadSection(sectionId) {
  if (!sectionId) return;
  let section = null, fw = null;
  for (const [key, f] of Object.entries(REGULATIONS)) {
    const s = f.sections.find(x => x.id === sectionId);
    if (s) { section = s; fw = f; break; }
  }
  if (!section) return;

  // Highlight nav
  document.querySelectorAll('.section-item').forEach(el => el.classList.remove('active'));
  const navItem = document.getElementById(`nav-${sectionId}`);
  if (navItem) {
    navItem.classList.add('active');
    // Ensure parent is open
    const fwKey = sectionId.split('-')[0];
    toggleFramework(fwKey, true);
  }

  const jurClass = fw.jurisdiction === 'India' ? 'jur-india' : fw.jurisdiction === 'United States' ? 'jur-us' : 'jur-international';

  const xrefChips = (section.xrefs || []).map(xid => {
    const lbl = getSectionLabel(xid);
    return `<span class="xref-chip" onclick="loadSection('${xid}')">${lbl}</span>`;
  }).join('');

  const content = document.getElementById('content-area');
  content.innerHTML = `
    <div id="ref-card">
      <div class="card-header">
        <span class="jur-badge ${jurClass}">${fw.jurisdiction}</span>
        <span class="fw-badge">${fw.icon} ${fw.label}</span>
      </div>
      <div class="card-title">${section.fullName}</div>
      <div class="card-date">Effective: ${section.date}</div>

      <div class="lang-toggle">
        <button class="lang-btn ${currentLang==='plain'?'active':''}" onclick="setLang('plain')">Plain English</button>
        <button class="lang-btn ${currentLang==='legal'?'active':''}" onclick="setLang('legal')">Regulatory Text</button>
      </div>

      <div class="card-section" id="obligation-section">
        <div class="card-section-label">Obligation</div>
        <div class="card-section-text" id="obligation-text">${currentLang==='plain' ? section.plainEnglish : section.obligation}</div>
      </div>

      <div class="card-section penalty-section">
        <div class="card-section-label"><span class="penalty-icon">⚠</span>Penalty</div>
        <div class="card-section-text">${section.penalty}</div>
      </div>

      <div class="card-section enforcement-section">
        <div class="card-section-label">Enforcement Body</div>
        <div class="card-section-text">${section.enforcement}</div>
      </div>

      ${xrefChips ? `<div class="xref-section"><h4>Related Regulations</h4><div class="xref-chips">${xrefChips}</div></div>` : ''}
    </div>
  `;

  // Store for toggle
  content.dataset.sectionId = sectionId;
  document.getElementById('mobile-nav-select').value = sectionId;
}

function setLang(lang) {
  currentLang = lang;
  const sectionId = document.getElementById('content-area').dataset.sectionId;
  if (sectionId) {
    // Update just the text and button states
    let section = null;
    for (const f of Object.values(REGULATIONS)) {
      const s = f.sections.find(x => x.id === sectionId);
      if (s) { section = s; break; }
    }
    if (section) {
      document.getElementById('obligation-text').textContent = lang === 'plain' ? section.plainEnglish : section.obligation;
    }
    document.querySelectorAll('.lang-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && lang === 'plain') || (i === 1 && lang === 'legal'));
    });
  }
}

  const tileHTML = Object.entries(REGULATIONS).map(([key, fw]) => {

    return `
      <div class="fw-tile" onclick="toggleFramework('${key}', true); loadSection('${fw.sections[0].id}')">
        <div class="tile-icon">${fw.icon}</div>
        <h4>${fw.label}</h4>
        <p>${fw.jurisdiction}</p>
        <div class="tile-count">${fw.sections.length} sections</div>
      </div>`;
  }).join('');

  document.getElementById('content-area').innerHTML = `
    <div id="welcome">
      <h1>Regulatory Explorer</h1>
      <p class="sub">A reference tool for financial crime compliance professionals. Navigate frameworks, read obligations in plain English, and test your knowledge with real-world scenarios.</p>
      <div class="fw-tiles">${tileHTML}</div>
    </div>`;
}

/* ================================================================
   SEARCH / FILTER
================================================================ */
function filterTree(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.framework-group').forEach(group => {
    let anyVisible = false;
    group.querySelectorAll('.section-item').forEach(item => {
      const match = !q || item.dataset.label.includes(q);
      item.style.display = match ? '' : 'none';
      if (match) anyVisible = true;
    });
    group.style.display = anyVisible || !q ? '' : 'none';
    if (q && anyVisible) toggleFramework(group.dataset.fw, true);
  });
}

/* ================================================================
   MOBILE SIDEBAR
================================================================ */
let mobileNavOpen = false;
function toggleMobileNav() {
  mobileNavOpen = !mobileNavOpen;
  const navTree = document.getElementById('nav-tree');
  navTree.style.display = mobileNavOpen ? 'block' : '';
  document.getElementById('mobile-sidebar-btn').textContent = mobileNavOpen ? 'Browse Regulations ▲' : 'Browse Regulations ▾';
}

/* ================================================================
   WHICH LAW APPLIES — SCENARIO CHECKER
================================================================ */
let currentMode = 'test';
let currentScenario = null;
let answered = false;

function buildScenarioSelect() {
  const sel = document.getElementById('scenario-select');
  SCENARIOS_WLA.forEach((sc, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Scenario ${sc.id}`;
    sel.appendChild(opt);
  });
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-test').classList.toggle('active', mode === 'test');
  document.getElementById('btn-ref').classList.toggle('active', mode === 'reference');
  if (currentScenario !== null) renderScenario(currentScenario);
}

function loadScenario() {
  const val = document.getElementById('scenario-select').value;
  if (val === '') { document.getElementById('scenario-body').innerHTML = ''; currentScenario = null; return; }
  currentScenario = parseInt(val);
  answered = false;
  renderScenario(currentScenario);
}

function renderScenario(idx) {
  const sc = SCENARIOS_WLA[idx];
  const body = document.getElementById('scenario-body');
  answered = false;
  let html = `<div class="scenario-text">${sc.text}</div>`;

  if (currentMode === 'test') {
    html += `<div class="mcq-options">`;
    sc.mcqOptions.forEach((opt, i) => {
      html += `<div class="mcq-opt" id="mcq-opt-${i}" onclick="selectMCQ(${idx},${i})">${opt}</div>`;
    });
    html += `</div>`;
    html += `<div id="analysis-reveal"></div>`;
  } else {
    html += `<button class="analyze-btn" onclick="revealAnalysis(${idx})">Analyze →</button>`;
    html += `<div id="analysis-reveal" style="margin-top:12px;"></div>`;
  }

  body.innerHTML = html;
}

function selectMCQ(scenarioIdx, chosenIdx) {
  if (answered) return;
  answered = true;
  const sc = SCENARIOS_WLA[scenarioIdx];
  sc.mcqOptions.forEach((_, i) => {
    const el = document.getElementById(`mcq-opt-${i}`);
    el.classList.add('disabled');
    if (i === sc.correctIndex) el.classList.add('correct');
    else if (i === chosenIdx && chosenIdx !== sc.correctIndex) el.classList.add('wrong');
  });
  revealAnalysis(scenarioIdx);
}

function revealAnalysis(idx) {
  const sc = SCENARIOS_WLA[idx];
  const a = sc.answer;
  const lawBadges = a.laws.map(l => `<span class="law-badge">${l}</span>`).join('');
  const obls = a.obligations.map(o => `<li>${o}</li>`).join('');
  document.getElementById('analysis-reveal').innerHTML = `
    <div class="analysis-card">
      <h4>Applicable Laws</h4>
      <div class="law-badges">${lawBadges}</div>
      <h4>Obligations</h4>
      <ul class="obligations-list">${obls}</ul>
      <div class="deadline-box">
        <div class="dl-label">Deadline</div>
        <p>${a.deadline}</p>
      </div>
      <div class="penalty-box">
        <div class="pl-label">Penalty Exposure</div>
        <p>${a.penalty}</p>
      </div>
    </div>`;
}

/* ================================================================
   FATF WATCH LIST
================================================================ */
function buildFATFList() {
  const container = document.getElementById('fatf-regions');
  for (const [region, lists] of Object.entries(FATF_WATCHLIST)) {
    const div = document.createElement('div');
    div.className = 'fatf-region';
    div.innerHTML = `<div class="fatf-region-label">${region}</div><div class="fatf-chips">
      ${lists.grey.map(c=>`<span class="fatf-chip fatf-grey">${c}</span>`).join('')}
      ${lists.black.map(c=>`<span class="fatf-chip fatf-black">${c}</span>`).join('')}
    </div>`;
    container.appendChild(div);
  }
}

/* ================================================================
   INIT
================================================================ */
buildTree();
buildScenarioSelect();
buildFATFList();
showWelcome();
</script>
</body>
</html>
