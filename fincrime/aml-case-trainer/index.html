<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AML Case Trainer — FinCrime</title>
<style>
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#d97706; --accent2:#16a34a;
  --nav-h:52px; --green:#22c55e; --red:#ef4444; --yellow:#f59e0b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);
  background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100;
}
nav a{color:var(--muted);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;transition:color .15s;}
nav a:hover{color:var(--text);}
.nav-sep{color:var(--border);font-size:16px;}
.nav-title{color:var(--text);font-weight:600;font-size:14px;}
.nav-badge{margin-left:auto;background:rgba(217,119,6,.15);color:var(--accent);border:1px solid rgba(217,119,6,.3);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px;}

/* MAIN */
main{margin-top:var(--nav-h);min-height:calc(100vh - var(--nav-h));padding:0;}

/* ===== LIBRARY VIEW ===== */
#view-library{padding:32px 24px 48px;}
.lib-header{margin-bottom:28px;}
.lib-header h1{font-size:24px;font-weight:700;margin-bottom:6px;}
.lib-header p{color:var(--muted);font-size:14px;}

.case-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}
.case-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:20px;display:flex;flex-direction:column;gap:12px;
  cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;
}
.case-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-typology{
  background:rgba(217,119,6,.12);color:var(--accent);
  border:1px solid rgba(217,119,6,.25);border-radius:4px;
  padding:2px 8px;font-size:10px;font-weight:600;letter-spacing:.4px;
  white-space:nowrap;flex-shrink:0;
}
.card-title{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:2px;}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card-industry{
  background:var(--bg3);border:1px solid var(--border);
  color:var(--muted);border-radius:4px;padding:2px 7px;font-size:11px;
}
.card-stars{color:var(--accent);font-size:12px;letter-spacing:1px;}
.card-summary{color:var(--muted);font-size:13px;line-height:1.55;flex:1;}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;}
.card-tag{
  background:rgba(139,148,158,.1);color:var(--muted);
  border-radius:3px;padding:2px 6px;font-size:11px;
}
.card-btn{
  background:var(--accent);color:#000;border:none;border-radius:6px;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s,opacity .15s;margin-top:auto;
  display:flex;align-items:center;justify-content:space-between;
}
.card-btn:hover{background:#b45309;}
.card-complete-badge{
  position:absolute;top:12px;right:12px;
  background:rgba(34,197,94,.15);color:var(--green);
  border:1px solid rgba(34,197,94,.3);border-radius:20px;
  padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.4px;
}

/* ===== CASE VIEW ===== */
#view-case{
  display:flex;height:calc(100vh - var(--nav-h));overflow:hidden;
}
.case-left{
  width:55%;min-width:0;border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.case-right{
  width:45%;min-width:0;
  display:flex;flex-direction:column;overflow:hidden;
}

/* Case header */
.case-header{
  padding:18px 20px 0;border-bottom:1px solid var(--border);
  background:var(--bg2);
}
.case-back-btn{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:13px;padding:0;margin-bottom:12px;display:flex;align-items:center;gap:4px;
  transition:color .15s;
}
.case-back-btn:hover{color:var(--text);}
.case-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.case-header-title{font-size:18px;font-weight:700;line-height:1.3;}
.case-header-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.badge-typology{
  background:rgba(217,119,6,.12);color:var(--accent);
  border:1px solid rgba(217,119,6,.25);border-radius:4px;
  padding:3px 9px;font-size:11px;font-weight:600;
}
.badge-industry{
  background:var(--bg3);border:1px solid var(--border);
  color:var(--muted);border-radius:4px;padding:3px 9px;font-size:11px;
}
.badge-complexity{color:var(--accent);font-size:12px;}

/* Tabs */
.tabs{display:flex;gap:0;padding:0 20px;background:var(--bg2);}
.tab-btn{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:10px 14px;font-size:13px;font-weight:500;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
  white-space:nowrap;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* Tab panels */
.tab-panels{flex:1;overflow-y:auto;padding:20px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* Background */
.bg-text{color:var(--muted);line-height:1.75;white-space:pre-wrap;font-size:13px;}

/* Customer profile */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.profile-row{background:var(--bg2);padding:12px 14px;}
.profile-row:nth-child(odd){background:var(--bg3);}
.profile-label{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px;}
.profile-value{color:var(--text);font-size:13px;font-weight:500;}

/* Transactions */
.txn-table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{
  background:var(--bg3);color:var(--muted);font-weight:600;
  padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);
  white-space:nowrap;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
}
tbody tr{border-bottom:1px solid rgba(48,54,61,.6);}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:9px 10px;color:var(--text);vertical-align:top;}
.txn-amount{font-family:monospace;font-weight:600;color:var(--green);white-space:nowrap;}
.txn-amount.out{color:var(--red);}
.risk-badge{
  display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;
  letter-spacing:.3px;
}
.risk-high{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.risk-medium{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.2);}
.risk-low{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2);}

/* Red Flags */
.flag-list{display:flex;flex-direction:column;gap:8px;}
.flag-item{
  display:flex;align-items:flex-start;gap:10px;
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s;
  user-select:none;
}
.flag-item:hover{border-color:var(--muted);}
.flag-item.selected-correct{border-color:var(--green);background:rgba(34,197,94,.05);}
.flag-item.selected-wrong{border-color:var(--red);background:rgba(239,68,68,.05);}
.flag-checkbox{
  width:18px;height:18px;border:2px solid var(--border);border-radius:4px;
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-size:11px;font-weight:700;
}
.flag-item.selected-correct .flag-checkbox{background:var(--green);border-color:var(--green);color:#000;}
.flag-item.selected-wrong .flag-checkbox{background:var(--red);border-color:var(--red);color:#fff;}
.flag-text{color:var(--muted);font-size:13px;line-height:1.45;transition:color .15s;}
.flag-item.selected-correct .flag-text,.flag-item.selected-wrong .flag-text{color:var(--text);}
.flag-submit-row{margin-top:14px;display:flex;align-items:center;gap:12px;}
.flag-submit-btn{
  background:var(--accent);color:#000;border:none;border-radius:6px;
  padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;
}
.flag-submit-btn:hover{background:#b45309;}
.flag-result-text{font-size:13px;color:var(--muted);}
.flag-reveal-row{margin-top:14px;}
.flag-reveal-row .flag-item{cursor:default;}
.flag-item.correct-reveal{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.04);}
.flag-item.correct-reveal .flag-checkbox{background:var(--green);border-color:var(--green);color:#000;}
.flag-item.correct-reveal .flag-text{color:var(--text);}
.flag-item.decoy-reveal{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.03);}
.flag-item.decoy-reveal .flag-checkbox{background:rgba(48,54,61,.8);border-color:var(--red);color:var(--red);}
.flag-item.decoy-reveal .flag-text{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(239,68,68,.5);}

/* Documents */
.doc-list{display:flex;flex-direction:column;gap:10px;}
.doc-item{
  background:var(--bg2);border:1px solid var(--border);border-radius:7px;
  padding:14px 16px;display:flex;align-items:flex-start;gap:12px;
}
.doc-icon{font-size:20px;flex-shrink:0;margin-top:2px;}
.doc-body h4{font-size:13px;font-weight:600;margin-bottom:4px;}
.doc-body p{color:var(--muted);font-size:12px;line-height:1.5;}
.doc-status{
  margin-left:auto;flex-shrink:0;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:3px;letter-spacing:.3px;align-self:flex-start;
}
.doc-available{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.doc-missing{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.doc-partial{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.2);}

/* ===== DECISION CONSOLE ===== */
.console-header{
  padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg2);
}
.console-header h3{font-size:14px;font-weight:700;margin-bottom:6px;}
.progress-bar-wrap{background:var(--bg3);border-radius:20px;height:6px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:20px;transition:width .4s;}
.progress-label{color:var(--muted);font-size:11px;margin-top:5px;}

.console-steps{flex:1;overflow-y:auto;padding:16px 20px;}
.step{
  margin-bottom:16px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;transition:border-color .2s;
}
.step.active{border-color:rgba(217,119,6,.4);}
.step.answered-correct{border-color:rgba(34,197,94,.3);}
.step.answered-wrong{border-color:rgba(239,68,68,.3);}
.step-header{
  padding:12px 14px;display:flex;align-items:flex-start;gap:10px;
  cursor:pointer;
}
.step-num{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  flex-shrink:0;background:var(--bg3);color:var(--muted);transition:all .2s;
}
.step.active .step-num{border-color:var(--accent);color:var(--accent);}
.step.answered-correct .step-num{background:var(--green);border-color:var(--green);color:#000;}
.step.answered-wrong .step-num{background:var(--red);border-color:var(--red);color:#fff;}
.step-q{font-size:13px;font-weight:600;line-height:1.45;color:var(--text);}
.step.locked .step-q{color:var(--muted);}
.step-body{padding:0 14px 14px 46px;}
.choice-list{display:flex;flex-direction:column;gap:7px;}
.choice-btn{
  background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px;text-align:left;color:var(--muted);font-size:12px;
  line-height:1.4;cursor:pointer;transition:all .15s;width:100%;
}
.choice-btn:hover:not(:disabled){border-color:var(--muted);color:var(--text);}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct{background:rgba(34,197,94,.08);border-color:var(--green);color:var(--text);}
.choice-btn.wrong{background:rgba(239,68,68,.08);border-color:var(--red);color:var(--text);}
.step-rationale{
  margin-top:10px;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.55;color:var(--muted);
}
.step-rationale.correct-r{border-color:rgba(34,197,94,.3);color:var(--green);}
.step-rationale.wrong-r{border-color:rgba(239,68,68,.3);color:var(--red);}

/* Outcome panel */
.outcome-panel{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:20px;margin-top:8px;display:none;
}
.outcome-panel.visible{display:block;}
.outcome-panel h4{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--accent);}
.outcome-text{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:16px;}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.score-num{font-size:28px;font-weight:800;color:var(--text);}
.score-denom{font-size:16px;color:var(--muted);margin-top:4px;}
.score-label{color:var(--muted);font-size:12px;line-height:1.4;}
.competency-badge-wrap{
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:16px;
}
.competency-icon{font-size:28px;}
.competency-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:3px;}
.competency-title{font-size:14px;font-weight:700;}
.return-btn{
  background:var(--accent);color:#000;border:none;border-radius:6px;
  padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;
  width:100%;
}
.return-btn:hover{background:#b45309;}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

/* Utility */
.hidden{display:none!important;}

/* Responsive */
@media(max-width:768px){
  #view-case{flex-direction:column;height:auto;overflow:visible;}
  .case-left,.case-right{width:100%;height:auto;max-height:none;overflow:visible;}
  .case-left{border-right:none;border-bottom:1px solid var(--border);}
  .tab-panels{overflow-y:visible;}
  .console-steps{overflow-y:visible;}
}
</style>
</head>
<body>

<nav>
  <a href="../../index.html">&#8592; Everything</a>
  <span class="nav-sep">|</span>
  <span class="nav-title">AML Case Trainer</span>
  <span class="nav-badge">FinCrime</span>
</nav>

<main>
  <!-- VIEW: LIBRARY -->
  <div id="view-library">
    <div class="lib-header">
      <h1>AML Case Library</h1>
      <p>Eight real-world typology cases. Review evidence, identify red flags, make decisions.</p>
    </div>
    <div class="case-grid" id="case-grid">
      <!-- Cards injected by JS -->
    </div>
  </div>

  <!-- VIEW: CASE STUDY -->
  <div id="view-case" class="hidden">
    <!-- Left panel: case file -->
    <div class="case-left">
      <div class="case-header">
        <button class="case-back-btn" onclick="showView('library')">&#8592; Back to Library</button>
        <div class="case-header-top">
          <div class="case-header-title" id="case-title">—</div>
        </div>
        <div class="case-header-badges" id="case-badges"></div>
        <div class="tabs" id="case-tabs">
          <button class="tab-btn active" data-tab="background">Background</button>
          <button class="tab-btn" data-tab="customer">Customer Profile</button>
          <button class="tab-btn" data-tab="transactions">Transactions</button>
          <button class="tab-btn" data-tab="redflags">Red Flags</button>
          <button class="tab-btn" data-tab="documents">Documents</button>
        </div>
      </div>
      <div class="tab-panels" id="tab-panels">
        <div class="tab-panel active" id="tab-background"></div>
        <div class="tab-panel" id="tab-customer"></div>
        <div class="tab-panel" id="tab-transactions"></div>
        <div class="tab-panel" id="tab-redflags"></div>
        <div class="tab-panel" id="tab-documents"></div>
      </div>
    </div>

    <!-- Right panel: decision console -->
    <div class="case-right">
      <div class="console-header">
        <h3>Decision Console</h3>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-label" id="progress-label">0 of 0 decisions made</div>
      </div>
      <div class="console-steps" id="console-steps"></div>
    </div>
  </div>
</main>

<script>
/* =========================================================
   DATA
   ========================================================= */
const CASES = [
  { id:'nail-bar', title:'The Nail Bar Network', typology:'Cash-Intensive Smurfing', industry:'Retail', complexity:2, summary:'A chain of 12 nail salons deposits just below reporting thresholds daily. Revenue is 3-7x industry norms.', tags:['structuring','cash','smurfing'] },
  { id:'project-sunrise', title:'Project Sunrise', typology:'Real Estate ML', industry:'Real Estate', complexity:3, summary:'A property developer receives cash advances from shell companies with BVI registration and no verified beneficial owners.', tags:['real estate','shell company','BVI'] },
  { id:'ghost-exporter', title:'The Ghost Exporter', typology:'Trade-Based ML (TBML)', industry:'International Trade', complexity:3, summary:'An export firm invoices goods at 5x market value. The bank financing the LC finds inconsistencies in shipping documents.', tags:['TBML','trade finance','over-invoicing'] },
  { id:'crypto-casino', title:'Crypto Casino', typology:'Virtual Asset Layering', industry:'Crypto / Gambling', complexity:3, summary:'Large crypto deposits, minimal gambling, "winnings" withdrawn to a different wallet. Classic wash transaction.', tags:['crypto','VASP','gambling'] },
  { id:'helpful-solicitor', title:'The Helpful Solicitor', typology:'Professional Enabler', industry:'Legal Services', complexity:2, summary:'A law firm holds client funds in trust and makes transfers on client instructions without questioning source of funds.', tags:['DNFBP','lawyer','trust account'] },
  { id:'shell-maze', title:'Shell Company Maze', typology:'Beneficial Ownership Concealment', industry:'Corporate Finance', complexity:3, summary:'Seven holding companies across 4 jurisdictions obscure the beneficial owner — a sanctioned individual.', tags:['beneficial ownership','sanctions','shell company'] },
  { id:'friendly-politician', title:'The Friendly Politician', typology:'PEP Corruption', industry:'Government', complexity:2, summary:"A minister's relative receives transfers from companies that received government contracts, described as consulting fees.", tags:['PEP','corruption','bribery'] },
  { id:'fast-fashion', title:'Fast Fashion Fraud', typology:'Import/Export Under-Invoicing', industry:'Textile', complexity:2, summary:'A garment exporter invoices at 30% below market value while the actual payment is topped up through hawala.', tags:['TBML','hawala','under-invoicing'] }
];

const CASE_DETAILS = {
  'nail-bar': {
    background: `Glamour Nails is a chain of 12 nail salons operating across Mumbai. The owner, Mr. Chen Wei, arrived on a business visa 18 months ago and incorporated the chain within 2 months. All 12 locations are cash-only.\n\nThe bank's TM system has flagged the accounts for 60 days. Each branch deposits ₹4.8-4.9 lakhs daily — just below the ₹5 lakh threshold. Deposits occur at different branches, at different times, by different individuals.\n\nNail salons typically generate ₹2-4 lakhs per month per outlet. 12 outlets at normal revenue = ₹24-48 lakhs/month. The bank is seeing ₹1.7 crore per week.`,
    customer: { name:'Chen Wei / Glamour Nails Pvt Ltd', nationality:'Chinese (Business Visa)', account:'Current × 12', relationship:'18 months', occupation:'Nail Salon Operator', declared_income:'₹8-12 lakhs/month' },
    transactions: [
      { date:'2024-01-15', amount:485000, type:'Cash Deposit', party:'BKC Branch — Self', channel:'Cash', desc:'Daily sales', risk:'high' },
      { date:'2024-01-15', amount:492000, type:'Cash Deposit', party:'Andheri Branch — Self', channel:'Cash', desc:'Daily sales', risk:'high' },
      { date:'2024-01-15', amount:487000, type:'Cash Deposit', party:'Juhu Branch — Self', channel:'Cash', desc:'Daily sales', risk:'high' },
      { date:'2024-01-16', amount:1800000, type:'NEFT Out', party:'HQ Master Account', channel:'NEFT', desc:'Intercompany transfer', risk:'high' },
      { date:'2024-01-16', amount:1200000, type:'RTGS Out', party:'China Supplier', channel:'RTGS', desc:'Supplier payment', risk:'high' },
      { date:'2024-01-17', amount:489000, type:'Cash Deposit', party:'Powai Branch — Self', channel:'Cash', desc:'Daily sales', risk:'high' },
      { date:'2024-01-18', amount:488000, type:'Cash Deposit', party:'BKC Branch — Self', channel:'Cash', desc:'Daily sales', risk:'high' },
      { date:'2024-01-18', amount:2100000, type:'RTGS Out', party:'HK Supplier', channel:'RTGS', desc:'Supplier payment', risk:'high' }
    ],
    red_flags: [
      { text:'All 12 branches deposit just below ₹5 lakh threshold daily', correct:true },
      { text:'Cash deposits aggregate to ₹1.7 crore/week — 3-7x normal industry revenue', correct:true },
      { text:'Multiple individuals depositing at different branches simultaneously', correct:true },

        { t:'Layering — cleaning placed cash by moving it internationally.', c:true, r:'Correct. This is layering: cash (placement) is converted to bank credits (structuring), then wired abroad (layering) to obscure origin.' },

  'ghost-exporter': {

      { date:'2024-01-08', amount:4500000, type:'LC Payment In', party:'Future Tech HK', channel:'SWIFT', desc:'Export proceeds — Shipment #HE-001', risk:'high' },
      { date:'2024-01-10', amount:3800000, type:'NEFT Out', party:'Subhash Metal Works', channel:'NEFT', desc:'Raw material purchase', risk:'medium' },

      { date:'2024-01-15', amount:2200000, type:'NEFT Out', party:'Director Personal', channel:'NEFT', desc:'Director remuneration', risk:'high' },
      { date:'2024-01-20', amount:5100000, type:'LC Payment In', party:'Future Tech HK', channel:'SWIFT', desc:'Export proceeds — Shipment #HE-003', risk:'high' },
      { date:'2024-01-25', amount:4800000, type:'RTGS Out', party:'Dubai Holding Co.', channel:'RTGS', desc:'Investment transfer', risk:'high' }

    red_flags: [

      { text:'Buyer incorporated 3 months before first LC — no prior history', correct:true },
      { text:'Exporter and buyer share the same registered agent', correct:true },
      { text:'Rapid conversion of LC proceeds to outward remittances', correct:true },
      { text:'Proceeds transferred to Dubai holding company with no documented business purpose', correct:true },
      { text:'No evidence of actual physical shipment beyond documentation', correct:true },
      { text:"Both parties are related — arm's length pricing not applicable", correct:true },
      { text:'The LC facility was renewed without incident last year', correct:false }

    decisions: [
      { q:'The invoice price is 4.7-5.6x market price. What does this indicate?', choices:[
        { t:'Premium products may command higher prices — engineering components vary widely.', c:false, r:'A 4.7-5.6x premium over publicly available market data for standard components is not credible without specific evidence of differentiation.' },
        { t:'This is over-invoicing — a classic TBML technique to move value internationally under the guise of trade.', c:true, r:'Correct. Over-invoicing allows the exporter to receive payment exceeding the actual goods value, effectively transferring the excess as a capital export disguised as trade.' },
        { t:"Request the exporter's cost breakdown before concluding.", c:false, r:'A cost breakdown would be useful but does not change the obligation to flag the pricing anomaly immediately.' }
      ]},
      { q:'The exporter and buyer share the same registered agent. What is the significance?', choices:[

        { t:"This suggests the buyer and seller are related parties — the \"export\" may be a sham transaction to move funds.", c:true, r:'Correct. A related-party transaction presented as an arm\'s length export is a fundamental TBML indicator. Pricing between related parties is not market-driven.' },
        { t:'The company secretary handles registrations for efficiency — not unusual.', c:false, r:'Sharing a registered agent between an exporter and its supposed arm\'s length overseas buyer is unusual and inconsistent with genuine commercial separation.' }

      { q:'Should the bank file an STR and also report to FEMA authorities?', choices:[

        { t:'File STR with FIU-IND and separately report FEMA concerns to the RBI/ED.', c:true, r:'Correct. TBML straddles both PMLA and FEMA. The bank must file STR under PMLA and may need to report the suspicious LC transaction under FEMA cross-border reporting obligations.' },

/* =========================================================
   STATE
   ========================================================= */
let currentCaseId = null;
let currentCase = null;
let stepAnswers = [];   // null | {choiceIndex, correct}
let flagSelections = {};
let flagsSubmitted = false;

/* =========================================================
   HELPERS
   ========================================================= */
function stars(n) {
  return '★'.repeat(n) + '☆'.repeat(3 - n);
}

function formatAmount(n) {
  return '₹' + n.toLocaleString('en-IN');
}

function isOutgoing(type) {
  return /out|withdrawal|bet/i.test(type);
}

function getStorageKey(caseId) {
  return 'fc-aml-cases-' + caseId;
}

function saveProgress(caseId, score, total) {
  localStorage.setItem(getStorageKey(caseId), JSON.stringify({ score, total, completed: true }));
}

function loadProgress(caseId) {
  try {
    const raw = localStorage.getItem(getStorageKey(caseId));
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

/* =========================================================
   LIBRARY
   ========================================================= */
function renderLibrary() {
  const grid = document.getElementById('case-grid');
  grid.innerHTML = CASES.map(c => {
    const prog = loadProgress(c.id);
    const badge = prog ? '<span class="card-complete-badge">Completed</span>' : '';
    return `
    <div class="case-card" onclick="openCase('${c.id}')">
      ${badge}
      <div class="card-top">
        <div>
          <div class="card-title">${c.title}</div>
        </div>
        <span class="card-typology">${c.typology}</span>
      </div>
      <div class="card-meta">
        <span class="card-industry">${c.industry}</span>
        <span class="card-stars" title="Complexity ${c.complexity}/3">${stars(c.complexity)}</span>
      </div>
      <p class="card-summary">${c.summary}</p>
      <div class="card-tags">${c.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
      <button class="card-btn">Open Case <span>→</span></button>
    </div>`;
  }).join('');
}

/* =========================================================
   VIEW CONTROLLER
   ========================================================= */
function showView(name) {
  document.getElementById('view-library').classList.toggle('hidden', name !== 'library');
  document.getElementById('view-case').classList.toggle('hidden', name !== 'case');
  if (name === 'library') {
    currentCaseId = null;
    currentCase = null;
    renderLibrary();
  }
}

/* =========================================================
   OPEN CASE
   ========================================================= */
function openCase(caseId) {
  currentCaseId = caseId;
  currentCase = CASE_DETAILS[caseId];
  const meta = CASES.find(c => c.id === caseId);

  // reset state
  stepAnswers = new Array(currentCase.decisions.length).fill(null);
  flagSelections = {};
  flagsSubmitted = false;

  // header
  document.getElementById('case-title').textContent = meta.title;
  document.getElementById('case-badges').innerHTML = `
    <span class="badge-typology">${meta.typology}</span>
    <span class="badge-industry">${meta.industry}</span>
    <span class="badge-complexity">${stars(meta.complexity)} Complexity</span>
  `;

  // activate first tab
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="background"]').classList.add('active');

  renderAllTabs();
  renderConsole();
  showView('case');
}

/* =========================================================
   TABS
   ========================================================= */
document.getElementById('case-tabs').addEventListener('click', function(e) {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
});

function renderAllTabs() {
  renderBackground();
  renderCustomer();
  renderTransactions();
  renderRedFlags();
  renderDocuments();
}

function renderBackground() {
  document.getElementById('tab-background').innerHTML = `
    <p class="bg-text">${currentCase.background}</p>
  `;
}

function renderCustomer() {
  const c = currentCase.customer;
  const rows = Object.entries(c).map(([k,v]) => {

}

function renderRedFlags() {
  const flags = currentCase.red_flags;
  const items = flags.map((f, i) => `
    <div class="flag-item" data-idx="${i}" onclick="toggleFlag(${i})">
      <div class="flag-checkbox" id="flag-cb-${i}"></div>
      <span class="flag-text">${f.text}</span>
    </div>
  `).join('');

  document.getElementById('tab-redflags').innerHTML = `
    <p style="color:var(--muted);font-size:12px;margin-bottom:14px;">Select all statements that represent genuine red flags for this case, then submit to see which are correct.</p>
    <div class="flag-list" id="flag-list">${items}</div>
    <div class="flag-submit-row" id="flag-submit-row">
      <button class="flag-submit-btn" onclick="submitFlags()">Submit Selections</button>
      <span class="flag-result-text" id="flag-result-text"></span>
    </div>
  `;
}

function toggleFlag(idx) {
  if (flagsSubmitted) return;
  const item = document.querySelector(`.flag-item[data-idx="${idx}"]`);
  const cb = document.getElementById('flag-cb-' + idx);
  if (flagSelections[idx]) {
    delete flagSelections[idx];
    item.classList.remove('selected-correct','selected-wrong');
    cb.textContent = '';
  } else {
    flagSelections[idx] = true;
    item.classList.add('selected-correct'); // temp visual
    cb.textContent = '✓';
  }
}

function submitFlags() {
  if (flagsSubmitted) return;
  flagsSubmitted = true;

  const flags = currentCase.red_flags;
  let correct = 0, total = flags.filter(f=>f.correct).length;

  flags.forEach((f, i) => {
    const item = document.querySelector(`.flag-item[data-idx="${i}"]`);
    const cb = document.getElementById('flag-cb-' + i);
    item.classList.remove('selected-correct','selected-wrong');
    item.style.cursor = 'default';

    if (f.correct) {
      item.classList.add('correct-reveal');
      cb.textContent = '✓';
      if (flagSelections[i]) correct++;
    } else {
      item.classList.add('decoy-reveal');
      cb.textContent = '✗';
    }
  });

  const missed = total - correct;
  document.getElementById('flag-result-text').textContent =
    `${correct}/${total} genuine red flags identified${missed>0?' ('+missed+' missed)':''}`;

  const btn = document.querySelector('.flag-submit-btn');
  if (btn) btn.style.display = 'none';
}

function renderDocuments() {
  const docs = DOCS_MAP[currentCaseId] || [];
  const items = docs.map(d => {
    let statusClass = 'doc-available', statusLabel = 'AVAILABLE';
    if (d.status === 'missing') { statusClass = 'doc-missing'; statusLabel = 'MISSING'; }
    if (d.status === 'partial') { statusClass = 'doc-partial'; statusLabel = 'PARTIAL'; }
    return `
      <div class="doc-item">
        <span class="doc-icon">${d.icon}</span>
        <div class="doc-body">
          <h4>${d.title}</h4>
          <p>${d.desc}</p>
        </div>
        <span class="doc-status ${statusClass}">${statusLabel}</span>
      </div>
    `;
  }).join('');

  document.getElementById('tab-documents').innerHTML = `<div class="doc-list">${items}</div>`;
}

/* =========================================================
   DECISION CONSOLE
   ========================================================= */
function renderConsole() {
  const steps = currentCase.decisions;
  const answered = stepAnswers.filter(a => a !== null).length;
  const pct = steps.length > 0 ? (answered / steps.length * 100) : 0;

  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${answered} of ${steps.length} decisions made`;

  const container = document.getElementById('console-steps');

  let html = steps.map((step, si) => {
    const ans = stepAnswers[si];
    const isAnswered = ans !== null;
    const isActive = !isAnswered && (si === 0 || stepAnswers[si-1] !== null);
    const isLocked = !isAnswered && !isActive;

    let stepClass = 'step';
    if (isActive) stepClass += ' active';
    if (isAnswered && ans.correct) stepClass += ' answered-correct';
    if (isAnswered && !ans.correct) stepClass += ' answered-wrong';
    if (isLocked) stepClass += ' locked';

    const choicesHtml = step.choices.map((ch, ci) => {
      let btnClass = 'choice-btn';
      if (isAnswered) {
        btnClass += ch.c ? ' correct' : (ci === ans.choiceIndex ? ' wrong' : '');
      }
      return `<button class="${btnClass}" ${isAnswered?'disabled':''} onclick="answerStep(${si},${ci})">${ch.t}</button>`;
    }).join('');

    let rationaleHtml = '';
    if (isAnswered) {
      const rationale = step.choices[ans.choiceIndex].r;
      rationaleHtml = `<div class="step-rationale ${ans.correct?'correct-r':'wrong-r'}">${rationale}</div>`;
    }

    const bodyHtml = (!isLocked) ? `<div class="step-body"><div class="choice-list">${choicesHtml}</div>${rationaleHtml}</div>` : '';

    return `
      <div class="${stepClass}" id="step-${si}">
        <div class="step-header" onclick="toggleStep(${si})">
          <div class="step-num">${isAnswered ? (ans.correct ? '✓' : '✗') : (si+1)}</div>
          <div class="step-q">${step.q}</div>
        </div>
        ${bodyHtml}
      </div>
    `;
  }).join('');

  // Outcome panel
  const allDone = stepAnswers.every(a => a !== null);
  const score = stepAnswers.filter(a => a && a.correct).length;
  const total = steps.length;
  let outcomeHtml = '';
  if (allDone) {
    saveProgress(currentCaseId, score, total);
    const pct2 = total > 0 ? Math.round(score/total*100) : 0;
    let badge, badgeIcon;
    if (pct2 === 100) { badge = 'Expert Analyst'; badgeIcon = '🥇'; }
    else if (pct2 >= 80) { badge = 'Senior Analyst'; badgeIcon = '🥈'; }
    else if (pct2 >= 60) { badge = 'Analyst'; badgeIcon = '🥉'; }
    else { badge = 'Trainee'; badgeIcon = '📋'; }

    outcomeHtml = `
      <div class="outcome-panel visible">
        <h4>Case Outcome</h4>
        <p class="outcome-text">${currentCase.outcome}</p>
        <div class="score-row">
          <div class="score-num">${score}</div>
          <div class="score-denom">/ ${total}</div>
          <div class="score-label">decisions correct<br><strong style="color:var(--text)">${pct2}% accuracy</strong></div>
        </div>
        <div class="competency-badge-wrap">
          <span class="competency-icon">${badgeIcon}</span>
          <div>
            <div class="competency-label">Competency Badge</div>
            <div class="competency-title">${badge}</div>
          </div>
        </div>
        <button class="return-btn" onclick="showView('library')">Return to Library</button>
      </div>
    `;
  }

  container.innerHTML = html + outcomeHtml;
}

function answerStep(stepIdx, choiceIdx) {
  if (stepAnswers[stepIdx] !== null) return;
  const choice = currentCase.decisions[stepIdx].choices[choiceIdx];
  stepAnswers[stepIdx] = { choiceIndex: choiceIdx, correct: choice.c };
  renderConsole();

  // scroll to next step or outcome
  setTimeout(() => {
    const nextStep = document.getElementById('step-' + (stepIdx + 1));
    if (nextStep) {
      nextStep.scrollIntoView({ behavior:'smooth', block:'nearest' });
    } else {
      const outcome = document.querySelector('.outcome-panel');
      if (outcome) outcome.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  }, 150);
}

function toggleStep(si) {
  // Locked steps don't open; answered steps can be re-viewed (already rendered)
  // Active steps are always open — nothing to toggle
}

/* =========================================================
   INIT
   ========================================================= */
renderLibrary();
showView('library');
</script>
