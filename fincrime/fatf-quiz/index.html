<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATF Quiz · FinCrime</title>
<style>
:root {
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#1d4ed8; --accent2:#0891b2;
  --nav-h:52px; --green:#22c55e; --red:#ef4444; --yellow:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;padding-top:var(--nav-h);min-height:100vh}
a{color:inherit;text-decoration:none}

/* ── SCREENS ── */
.screen{display:none;padding:2rem 1rem 4rem}

/* ── START SCREEN ── */
#screen-start{padding-top:2.5rem}
.start-card{max-width:600px;margin:0 auto;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2.25rem 2rem}
.start-title{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.35rem}
.start-sub{color:var(--muted);font-size:.9rem;margin-bottom:2rem;line-height:1.5}
.section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:.75rem}
.pill-group{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
.pill-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:.4rem .9rem;border-radius:999px;font-size:.8rem;cursor:pointer;transition:all .18s;font-family:inherit;font-weight:500}
.pill-btn:hover{border-color:var(--accent2);color:var(--text)}
.pill-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.count-group{display:flex;gap:.5rem;margin-bottom:2rem}
.count-btn{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:.5rem;border-radius:8px;font-size:.9rem;cursor:pointer;transition:all .18s;font-family:inherit;font-weight:600}
.count-btn:hover{border-color:var(--accent2);color:var(--text)}
.count-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.start-btn{width:100%;padding:.85rem;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.01em;transition:all .18s}
.start-btn:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 6px 20px rgba(29,78,216,.35)}
.start-btn:active{transform:translateY(0)}

/* ── QUESTION SCREEN ── */
#screen-question{padding-top:1.5rem}
.q-wrap{max-width:760px;margin:0 auto}
.q-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:1rem}
.q-progress-text{font-size:.85rem;color:var(--muted);font-weight:500}
.timer-ring{flex-shrink:0}
.timer-ring svg{display:block}
.timer-track{fill:none;stroke:var(--bg3);stroke-width:4}
.timer-arc{fill:none;stroke:var(--accent2);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.timer-text{font-size:.75rem;font-weight:700;fill:var(--text);dominant-baseline:middle;text-anchor:middle}
.topic-badge{display:inline-block;background:var(--bg3);border:1px solid var(--border);color:var(--accent2);font-size:.7rem;font-weight:600;letter-spacing:.05em;padding:.25rem .7rem;border-radius:999px;margin-bottom:.85rem;text-transform:uppercase}
.q-text{font-size:1.2rem;font-weight:700;line-height:1.5;margin-bottom:1.5rem;letter-spacing:-.02em}
.options-list{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.opt-btn{width:100%;text-align:left;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:.85rem 1rem;border-radius:10px;font-size:.9rem;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s,border-color .15s,color .15s;display:flex;align-items:center;gap:.75rem;line-height:1.4}
.opt-btn:hover:not(:disabled){background:#1c2128;border-color:var(--accent2)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:rgba(34,197,94,.15)!important;border-color:var(--green)!important;color:var(--green)!important}
.opt-btn.wrong{background:rgba(239,68,68,.15)!important;border-color:var(--red)!important;color:var(--red)!important}
.opt-letter{width:1.6rem;height:1.6rem;min-width:1.6rem;background:var(--bg2);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--muted)}
.opt-btn.correct .opt-letter{background:rgba(34,197,94,.2);border-color:var(--green);color:var(--green)}
.opt-btn.wrong   .opt-letter{background:rgba(239,68,68,.2);border-color:var(--red);color:var(--red)}

/* ── EXPLANATION PANEL ── */
.explanation{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;margin-top:.75rem;animation:slideDown .25s ease;border-left:3px solid var(--accent2)}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.expl-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent2);font-weight:700;margin-bottom:.35rem}
.expl-text{font-size:.85rem;line-height:1.6;color:var(--text);margin-bottom:.5rem}
.expl-ref{font-size:.75rem;color:var(--muted);font-style:italic}

.next-btn{width:100%;margin-top:1rem;padding:.75rem;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;display:none}
.next-btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}

.progress-bar-wrap{height:4px;background:var(--bg3);border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease}

/* ── SCORE SCREEN ── */
#screen-score{padding-top:1.5rem}
.score-wrap{max-width:640px;margin:0 auto}
.score-ring-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:2rem}
.score-ring-track{fill:none;stroke:var(--bg3);stroke-width:12}
.score-ring-arc{fill:none;stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.score-ring-label{font-size:2.25rem;font-weight:900;dominant-baseline:middle;text-anchor:middle;fill:var(--text);letter-spacing:-.03em}
.score-ring-sub{font-size:.8rem;dominant-baseline:middle;text-anchor:middle;fill:var(--muted)}
.tier-badge{display:inline-block;padding:.35rem 1.1rem;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:.75rem}
.tier-expert   {background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.4)}
.tier-proficient{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.4)}
.tier-developing{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.3)}
.tier-needs    {background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3)}

.breakdown-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.breakdown-title{font-size:.72rem;font-weight:700;margin-bottom:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.breakdown-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem}
.breakdown-topic{font-size:.83rem;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breakdown-bar-wrap{width:100px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;flex-shrink:0}
.breakdown-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
.breakdown-stat{font-size:.78rem;font-weight:600;color:var(--muted);flex-shrink:0;width:36px;text-align:right}

.review-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1.25rem}
.review-toggle{width:100%;text-align:left;background:none;border:none;color:var(--text);padding:1rem 1.25rem;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between}
.review-toggle:hover{background:var(--bg3)}
.review-toggle-icon{font-size:.75rem;color:var(--muted);transition:transform .25s}
.review-body{padding:0 1.25rem 1.25rem;display:none}
.review-body.open{display:block}
.review-item{border-top:1px solid var(--border);padding:.85rem 0}
.review-item:first-child{border-top:none;padding-top:0}
.review-q{font-size:.82rem;font-weight:600;margin-bottom:.4rem;color:var(--text);line-height:1.4}
.review-answer{font-size:.78rem;display:flex;align-items:flex-start;gap:.4rem;margin-bottom:.15rem;line-height:1.4}
.rv-dot{width:.45rem;height:.45rem;border-radius:50%;flex-shrink:0;margin-top:.3rem}

.score-actions{display:flex;gap:.75rem}
.score-actions button{flex:1;padding:.75rem;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s}
.btn-retry{background:var(--bg3);border:1px solid var(--border);color:var(--text)}
.btn-retry:hover{background:var(--accent);border-color:var(--accent)}
.btn-new{background:var(--accent);border:1px solid var(--accent);color:#fff}
.btn-new:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 4px 14px rgba(29,78,216,.4)}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .start-card{padding:1.5rem 1rem}
  .start-title{font-size:1.4rem}
  .q-text{font-size:1rem}
  .count-group{flex-wrap:wrap}
  .count-btn{flex:0 0 calc(50% - .25rem)}
  .score-actions{flex-direction:column}
}
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav style="position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:1rem;z-index:100;">
  <a href="../../" style="color:var(--muted);text-decoration:none;font-size:.875rem;">&#8592; Everything</a>
  <span style="color:var(--text);font-weight:600;">FATF Quiz</span>
  <span style="margin-left:auto;background:var(--accent);color:#fff;font-size:.75rem;padding:.25rem .75rem;border-radius:999px;">FinCrime</span>
</nav>

<!-- ════════════════════ SCREEN 1 — START ════════════════════ -->
<div id="screen-start" class="screen" style="display:block">
  <div class="start-card">
    <div class="start-title">FATF Knowledge Quiz</div>
    <div class="start-sub">Test your Financial Action Task Force expertise across 60 questions covering the 40 Recommendations, grey &amp; black lists, Travel Rule, and more.</div>

    <div class="section-label">Category</div>
    <div class="pill-group" id="cat-group">
      <button class="pill-btn active" data-val="all"                onclick="setCategory(this)">All Topics</button>
      <button class="pill-btn"        data-val="40 Recommendations" onclick="setCategory(this)">40 Recommendations</button>
      <button class="pill-btn"        data-val="Grey &amp; Black Lists"   onclick="setCategory(this)">Grey &amp; Black Lists</button>
      <button class="pill-btn"        data-val="Travel Rule"        onclick="setCategory(this)">Travel Rule</button>
      <button class="pill-btn"        data-val="Mutual Evaluations" onclick="setCategory(this)">Mutual Evaluations</button>
    </div>

    <div class="section-label">Difficulty</div>
    <div class="pill-group" id="diff-group">
      <button class="pill-btn active" data-val="all"          onclick="setDifficulty(this)">All Levels</button>
      <button class="pill-btn"        data-val="beginner"     onclick="setDifficulty(this)">Beginner</button>
      <button class="pill-btn"        data-val="intermediate" onclick="setDifficulty(this)">Intermediate</button>
      <button class="pill-btn"        data-val="expert"       onclick="setDifficulty(this)">Expert</button>
    </div>

    <div class="section-label">Number of Questions</div>
    <div class="count-group" id="count-group">
      <button class="count-btn"        data-val="5"  onclick="setCount(this)">5</button>
      <button class="count-btn active" data-val="10" onclick="setCount(this)">10</button>
      <button class="count-btn"        data-val="20" onclick="setCount(this)">20</button>
      <button class="count-btn"        data-val="40" onclick="setCount(this)">40</button>
    </div>

    <button class="start-btn" onclick="startQuiz()">Start Quiz &#8594;</button>
  </div>
</div>

<!-- ════════════════════ SCREEN 2 — QUESTION ════════════════════ -->
<div id="screen-question" class="screen">
  <div class="q-wrap">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="q-topbar">
      <div class="q-progress-text" id="q-progress-text">Question 1 of 10</div>
      <!-- Timer ring: r=18, circumference = 2*PI*18 = 113.097 -->
      <div class="timer-ring">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle class="timer-track" cx="26" cy="26" r="18"/>
          <circle class="timer-arc" id="timer-arc" cx="26" cy="26" r="18"
                  stroke-dasharray="113.1" stroke-dashoffset="0"/>
          <text class="timer-text" id="timer-text" x="26" y="26">30</text>
        </svg>
      </div>
    </div>

    <div class="topic-badge" id="topic-badge">Topic</div>
    <div class="q-text" id="q-text"></div>

    <div class="options-list" id="options-list"></div>
    <div id="explanation-panel"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question &#8594;</button>
  </div>
</div>

<!-- ════════════════════ SCREEN 3 — SCORE ════════════════════ -->
<div id="screen-score" class="screen">
  <div class="score-wrap">
    <div class="score-ring-wrap">
      <!-- Score ring: r=70, circumference = 2*PI*70 = 439.823 -->
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle class="score-ring-track" cx="90" cy="90" r="70"/>
        <circle class="score-ring-arc" id="score-arc" cx="90" cy="90" r="70"
                stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke="var(--accent)"/>
        <text class="score-ring-label" id="score-label" x="90" y="84">0/0</text>
        <text class="score-ring-sub"   id="score-pct"   x="90" y="106">0%</text>
      </svg>
      <div class="tier-badge" id="tier-badge">—</div>
    </div>

    <div class="breakdown-card">
      <div class="breakdown-title">Category Breakdown</div>
      <div id="breakdown-rows"></div>
    </div>

    <div class="review-card">
      <button class="review-toggle" onclick="toggleReview()">
        <span>Review Questions</span>
        <span class="review-toggle-icon" id="review-icon">&#9660;</span>
      </button>
      <div class="review-body" id="review-body"></div>
    </div>

    <div class="score-actions">
      <button class="btn-retry" onclick="retryQuiz()">&#8635; Retry Same</button>
      <button class="btn-new"   onclick="newQuiz()">New Quiz &#8594;</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  QUESTION BANK  (60 questions)
// ════════════════════════════════════════════════════════════
var QUESTIONS = [
  // ── 40 Recommendations ──────────────────────────────────
  { id:1,  topic:'40 Recommendations', difficulty:'beginner',
    question:'How many FATF Recommendations form the international standard for AML/CFT?',
    options:['30','40','50','60'], answer:1,
    explanation:'The FATF 40 Recommendations set the international standard for combating money laundering, terrorist financing, and proliferation financing.',
    reference:'FATF 40 Recommendations (2012, updated 2023)' },

  { id:2,  topic:'40 Recommendations', difficulty:'beginner',
    question:'What does FATF stand for?',
    options:['Financial Action Task Group','Financial Action Task Force','Financial Authority Task Force','Federal Action Task Force'], answer:1,
    explanation:'FATF stands for Financial Action Task Force. It is an intergovernmental body established in 1989 by the G7 Summit in Paris.',
    reference:'FATF Mandate' },

  { id:3,  topic:'40 Recommendations', difficulty:'intermediate',
    question:'Under FATF Recommendation 10, which customer due diligence measure is required for all customers?',
    options:['Enhanced due diligence only','Identifying and verifying customer identity','Filing a suspicious transaction report','Freezing customer accounts'], answer:1,
    explanation:'R.10 requires financial institutions to identify and verify the identity of customers and beneficial owners as a core CDD measure.',
    reference:'FATF Recommendation 10 — Customer Due Diligence' },

  { id:4,  topic:'40 Recommendations', difficulty:'intermediate',
    question:'FATF Recommendation 16 (the Travel Rule) requires originator information for wire transfers above what threshold?',
    options:['USD 500','USD 1,000','USD 3,000','No threshold — all transfers'], answer:3,
    explanation:'R.16 requires originator and beneficiary information for ALL wire transfers regardless of amount. There is no minimum threshold.',
    reference:'FATF Recommendation 16 — Wire Transfers' },

  { id:5,  topic:'40 Recommendations', difficulty:'intermediate',
    question:'Which FATF Recommendation specifically addresses Politically Exposed Persons (PEPs)?',
    options:['Recommendation 10','Recommendation 12','Recommendation 15','Recommendation 20'], answer:1,
    explanation:'Recommendation 12 requires financial institutions to apply enhanced due diligence measures to PEPs, both domestic and foreign.',
    reference:'FATF Recommendation 12 — Politically Exposed Persons' },

  { id:6,  topic:'40 Recommendations', difficulty:'expert',
    question:'Under FATF Recommendation 24, what is the key obligation regarding beneficial ownership of legal persons?',
    options:['Companies must list all shareholders publicly','Countries must ensure adequate, accurate and up-to-date information on beneficial ownership is available','All companies must register with FATF','Directors must undergo AML training'], answer:1,
    explanation:'R.24 requires countries to ensure timely access to adequate, accurate and current beneficial ownership information for legal persons to prevent their misuse for ML/TF.',
    reference:'FATF Recommendation 24 — Transparency and Beneficial Ownership of Legal Persons' },

  { id:7,  topic:'40 Recommendations', difficulty:'expert',
    question:'FATF Recommendation 15 on New Technologies requires countries to assess and mitigate ML/TF risks associated with which types of entities?',
    options:['Only cryptocurrency exchanges','Virtual asset service providers (VASPs) and new payment technologies','Only peer-to-peer platforms','Only decentralized finance protocols'], answer:1,
    explanation:'R.15 requires countries and financial institutions to identify and assess ML/TF risks arising from new products, technologies, and VASPs including crypto exchanges and wallet providers.',
    reference:'FATF Recommendation 15 — New Technologies' },

  { id:8,  topic:'40 Recommendations', difficulty:'beginner',
    question:'What does STR stand for in the context of FATF requirements?',
    options:['Standard Transaction Report','Suspicious Transaction Report','Structural Transfer Record','Systematic Tracking Report'], answer:1,
    explanation:'STR stands for Suspicious Transaction Report. FATF Recommendation 20 requires financial institutions to file STRs with the national FIU when they suspect ML/TF.',
    reference:'FATF Recommendation 20 — Reporting of Suspicious Transactions' },

  { id:9,  topic:'40 Recommendations', difficulty:'intermediate',
    question:'Under FATF standards, what is "tipping off"?',
    options:['Paying informants for information','Disclosing to a customer or third party that an STR has been filed about them','Reporting a colleague to regulators','Providing transaction records to law enforcement'], answer:1,
    explanation:'Tipping off occurs when a reporting entity (bank, VASP) discloses to a subject or related party that they have filed or are about to file an STR, potentially alerting them to avoid detection.',
    reference:'FATF Recommendation 21 — Tipping Off and Confidentiality' },

  { id:10, topic:'40 Recommendations', difficulty:'intermediate',
    question:'FATF Recommendation 6 targets which serious financial crime?',
    options:['Tax evasion','Terrorist financing','Insider trading','Currency smuggling'], answer:1,
    explanation:'Recommendation 6 specifically addresses targeted financial sanctions related to terrorism and terrorist financing, requiring countries to implement UN Security Council resolutions.',
    reference:'FATF Recommendation 6 — Targeted Financial Sanctions Related to Terrorism' },

  { id:11, topic:'40 Recommendations', difficulty:'expert',
    question:'What is a DNFBP under FATF standards?',
    options:['Digital Non-Financial Business Protocol','Designated Non-Financial Business or Profession','Data Network Financial Bureau Provider','Direct Non-Bank Financial Platform'], answer:1,
    explanation:'DNFBPs (Designated Non-Financial Businesses and Professions) include real estate agents, lawyers, accountants, trust and company service providers, and dealers in precious metals — all subject to FATF AML obligations.',
    reference:'FATF Glossary — DNFBP' },

  { id:12, topic:'40 Recommendations', difficulty:'expert',
    question:'Under FATF Recommendation 26, what is the primary role of a Financial Intelligence Unit (FIU)?',
    options:['To prosecute money launderers','To receive, analyze, and disseminate financial intelligence to competent authorities','To license financial institutions','To set interest rates for banks'], answer:1,
    explanation:'R.26 requires every country to establish an FIU as a central national agency that receives STRs and other relevant information, analyzes it, and disseminates it to competent authorities for investigation.',
    reference:'FATF Recommendation 26 — Regulation and Supervision of Financial Institutions' },

  // ── Grey & Black Lists ───────────────────────────────────
  { id:13, topic:'Grey & Black Lists', difficulty:'beginner',
    question:'What is the FATF "Grey List" formally known as?',
    options:['The Non-Compliant Jurisdictions List','Jurisdictions Under Increased Monitoring','The High-Risk Jurisdictions List','The Sanctioned Countries Register'], answer:1,
    explanation:'The Grey List is formally called "Jurisdictions Under Increased Monitoring." Countries on this list have committed to resolve deficiencies within agreed timeframes and are subject to increased scrutiny.',
    reference:'FATF Public Statements — Jurisdictions Under Increased Monitoring' },

  { id:14, topic:'Grey & Black Lists', difficulty:'beginner',
    question:'Which two countries are currently on the FATF Black List (High-Risk Jurisdictions Subject to a Call for Action)?',
    options:['Russia and China','Iran and North Korea','Pakistan and Turkey','Afghanistan and Syria'], answer:1,
    explanation:'Iran and North Korea are the two countries on the FATF Black List. They have strategic deficiencies in their AML/CFT regimes that pose serious threats to the international financial system.',
    reference:'FATF High-Risk Jurisdictions Subject to a Call for Action' },

  { id:15, topic:'Grey & Black Lists', difficulty:'intermediate',
    question:'What action must financial institutions take when dealing with a Black-Listed jurisdiction?',
    options:['Refuse all transactions','Apply enhanced due diligence and consider filing STRs','Immediately freeze all accounts','Report to the UN Security Council'], answer:1,
    explanation:'For black-listed jurisdictions, FATF calls on countries to apply enhanced due diligence proportionate to the risk, and in the most serious cases, to apply counter-measures such as refusing transactions.',
    reference:'FATF Recommendation 19 — Higher-Risk Countries' },

  { id:16, topic:'Grey & Black Lists', difficulty:'intermediate',
    question:'How often does FATF update its grey and black lists?',
    options:['Annually','Every 6 months','After each of the 3 FATF Plenary sessions per year','Only when a country requests it'], answer:2,
    explanation:'FATF holds three Plenary sessions per year (February, June, October) and updates the grey and black lists after each Plenary based on country progress and new assessments.',
    reference:'FATF Plenary Process' },

  { id:17, topic:'Grey & Black Lists', difficulty:'expert',
    question:'What is a Mutual Evaluation Report (MER) and how does it relate to grey listing?',
    options:['It is a self-assessment by the country','It is a peer review assessing a country\'s AML/CFT system; poor results can trigger grey listing','It is an annual financial report submitted to FATF','It is a bilateral treaty between two countries'], answer:1,

//  STATE
// ════════════════════════════════════════════════════════════
var currentQuestions  = [];
var currentIndex      = 0;
var score             = 0;
var timerInterval     = null;
var timeLeft          = 30;
var answered          = false;
var categoryScores    = {};
var quizResults       = [];
var lastQuizPool      = [];

var selectedCategory   = 'all';
var selectedDifficulty = 'all';
var questionCount      = 10;

var TIMER_MAX = 30;
var CIRCUMF   = 113.1;  // 2 * Math.PI * 18

// ════════════════════════════════════════════════════════════
//  UTILITY
// ════════════════════════════════════════════════════════════
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function showScreen(name) {
  ['start','question','score'].forEach(function(s) {
    document.getElementById('screen-' + s).style.display = (s === name) ? 'block' : 'none';
  });
  window.scrollTo(0, 0);
}

// ════════════════════════════════════════════════════════════
//  FILTER CONTROLS
// ════════════════════════════════════════════════════════════
function setCategory(btn) {
  document.querySelectorAll('#cat-group .pill-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  selectedCategory = btn.dataset.val;
}

function setDifficulty(btn) {
  document.querySelectorAll('#diff-group .pill-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  selectedDifficulty = btn.dataset.val;
}

function setCount(btn) {
  document.querySelectorAll('#count-group .count-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  questionCount = parseInt(btn.dataset.val, 10);
}

// ════════════════════════════════════════════════════════════
//  QUIZ FLOW
// ════════════════════════════════════════════════════════════
function startQuiz() {
  var pool = QUESTIONS.slice();
  if (selectedCategory !== 'all')   pool = pool.filter(function(q){ return q.topic === selectedCategory; });
  if (selectedDifficulty !== 'all') pool = pool.filter(function(q){ return q.difficulty === selectedDifficulty; });

  if (pool.length === 0) {
    alert('No questions match your selection. Please adjust the filters.');
    return;
  }

  // Fisher-Yates shuffle
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }

  currentQuestions = pool.slice(0, Math.min(questionCount, pool.length));
  lastQuizPool     = currentQuestions.slice();
  currentIndex     = 0;
  score            = 0;
  categoryScores   = {};
  quizResults      = [];

  showScreen('question');
  showQuestion();
}

function showQuestion() {
  var q = currentQuestions[currentIndex];
  answered = false;
  timeLeft = TIMER_MAX;

  // Progress bar
  document.getElementById('progress-bar').style.width = ((currentIndex / currentQuestions.length) * 100) + '%';

  // Progress text
  document.getElementById('q-progress-text').textContent =
    'Question ' + (currentIndex + 1) + ' of ' + currentQuestions.length;

  // Topic badge
  document.getElementById('topic-badge').textContent = q.topic;

  // Question text
  document.getElementById('q-text').textContent = q.question;

  // Build option buttons
  var letters = ['A','B','C','D'];
  var list = document.getElementById('options-list');
  list.innerHTML = '';
  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML =
      '<span class="opt-letter">' + letters[i] + '</span>' +
      '<span>' + escHtml(opt) + '</span>';
    btn.addEventListener('click', (function(idx){ return function(){ selectAnswer(idx); }; })(i));
    list.appendChild(btn);
  });

  // Reset explanation & next button
  var panel = document.getElementById('explanation-panel');
  panel.innerHTML = '';

  var nb = document.getElementById('next-btn');
  nb.style.display = 'none';
  nb.textContent = (currentIndex + 1 < currentQuestions.length) ? 'Next Question \u2192' : 'See Results \u2192';

  // Start timer
  updateTimerDisplay(TIMER_MAX);
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
}

function tickTimer() {
  timeLeft--;
  updateTimerDisplay(timeLeft);
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    selectAnswer(-1); // timeout treated as wrong
  }
}

function updateTimerDisplay(t) {
  var arc  = document.getElementById('timer-arc');
  var txt  = document.getElementById('timer-text');
  var frac = Math.max(0, t / TIMER_MAX);
  arc.style.strokeDashoffset = CIRCUMF * (1 - frac);
  // Colour: teal -> yellow -> red
  if (frac > 0.5)       arc.style.stroke = 'var(--accent2)';
  else if (frac > 0.25) arc.style.stroke = 'var(--yellow)';
  else                  arc.style.stroke = 'var(--red)';
  txt.textContent = Math.max(0, t);
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  var q       = currentQuestions[currentIndex];
  var correct = q.answer;
  var isRight = (index === correct);

  if (isRight) score++;

  // Per-question result
  quizResults[currentIndex] = { selected: index, isRight: isRight };

  // Category breakdown
  if (!categoryScores[q.topic]) categoryScores[q.topic] = { correct: 0, total: 0 };
  categoryScores[q.topic].total++;
  if (isRight) categoryScores[q.topic].correct++;

  // Colour buttons
  var buttons = document.querySelectorAll('#options-list .opt-btn');
  buttons.forEach(function(btn, i) {
    btn.disabled = true;
    if (i === correct) {
      btn.classList.add('correct');
    } else if (i === index && index !== correct) {
      btn.classList.add('wrong');
    }
  });

  // Explanation
  var resultLabel;
  if (isRight) {
    resultLabel = '<span style="color:var(--green);font-weight:700;">Correct!</span>';
  } else if (index === -1) {
    resultLabel = '<span style="color:var(--red);font-weight:700;">Time\'s up!</span>';
  } else {
    resultLabel = '<span style="color:var(--red);font-weight:700;">Incorrect</span>';
  }

  var panel = document.getElementById('explanation-panel');
  panel.innerHTML =
    '<div class="explanation">' +
      '<div class="expl-label">' + resultLabel + ' &mdash; Explanation</div>' +
      '<div class="expl-text">'  + escHtml(q.explanation) + '</div>' +
      '<div class="expl-ref">Reference: ' + escHtml(q.reference) + '</div>' +
    '</div>';

  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    showScore();
  } else {
    showQuestion();
  }
}

// ════════════════════════════════════════════════════════════
//  SCORE SCREEN
// ════════════════════════════════════════════════════════════
function showScore() {
  clearInterval(timerInterval);
  showScreen('score');

  var total       = currentQuestions.length;
  var pct         = total > 0 ? Math.round((score / total) * 100) : 0;
  var SCORE_CIRC  = 439.8; // 2 * Math.PI * 70

  document.getElementById('score-label').textContent = score + '/' + total;
  document.getElementById('score-pct').textContent   = pct + '%';

  // Arc colour
  var arcColor;
  if      (pct >= 90) arcColor = '#f59e0b';
  else if (pct >= 70) arcColor = 'var(--green)';
  else if (pct >= 50) arcColor = 'var(--yellow)';
  else                arcColor = 'var(--red)';

  var arc = document.getElementById('score-arc');
  arc.style.stroke           = arcColor;
  arc.style.transition       = 'none';
  arc.style.strokeDashoffset = SCORE_CIRC;

  // Animate after paint
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      arc.style.transition       = 'stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)';
      arc.style.strokeDashoffset = SCORE_CIRC * (1 - pct / 100);
    });
  });

  // Tier badge
  var tierClass, tierText;
  if      (pct >= 90) { tierClass = 'tier-expert';    tierText = 'Expert'; }
  else if (pct >= 70) { tierClass = 'tier-proficient';tierText = 'Proficient'; }
  else if (pct >= 50) { tierClass = 'tier-developing';tierText = 'Developing'; }
  else                { tierClass = 'tier-needs';      tierText = 'Needs Review'; }

  var tb = document.getElementById('tier-badge');
  tb.className  = 'tier-badge ' + tierClass;
  tb.textContent = tierText;

  // Category breakdown
  var topicColors = {
    '40 Recommendations': '#1d4ed8',
    'Grey & Black Lists':  '#0891b2',
    'Travel Rule':         '#7c3aed',
    'Mutual Evaluations':  '#059669'
  };

  var bRows = document.getElementById('breakdown-rows');
  bRows.innerHTML = '';
  Object.keys(categoryScores).forEach(function(topic) {
    var data     = categoryScores[topic];
    var topicPct = data.total > 0 ? (data.correct / data.total) * 100 : 0;
    var color    = topicColors[topic] || 'var(--accent)';
    bRows.innerHTML +=
      '<div class="breakdown-row">' +
        '<div class="breakdown-topic" title="' + escHtml(topic) + '">' + escHtml(topic) + '</div>' +
        '<div class="breakdown-bar-wrap">' +
          '<div class="breakdown-bar-fill" style="width:' + topicPct + '%;background:' + color + '"></div>' +
        '</div>' +
        '<div class="breakdown-stat" style="color:' + color + '">' + data.correct + '/' + data.total + '</div>' +
      '</div>';
  });
  if (!Object.keys(categoryScores).length) {
    bRows.innerHTML = '<div style="font-size:.83rem;color:var(--muted)">No data available.</div>';
  }

  // Review questions
  var reviewBody = document.getElementById('review-body');
  reviewBody.innerHTML = '';
  reviewBody.classList.remove('open');
  document.getElementById('review-icon').style.transform = 'rotate(0deg)';

  var letters = ['A','B','C','D'];
  currentQuestions.forEach(function(q, qi) {
    var res     = quizResults[qi] || { selected: -2, isRight: false };
    var userIdx = res.selected;

    var answerHtml = '';
    q.options.forEach(function(opt, oi) {
      var isRight = (oi === q.answer);
      var isUser  = (oi === userIdx);
      var color    = 'var(--muted)';
      var dotColor = '#30363d';
      var weight   = '400';
      if (isRight)            { color = 'var(--green)'; dotColor = 'var(--green)'; weight = '600'; }
      if (isUser && !isRight) { color = 'var(--red)';   dotColor = 'var(--red)';   weight = '600'; }
      answerHtml +=
        '<div class="review-answer" style="color:' + color + ';font-weight:' + weight + '">' +
          '<div class="rv-dot" style="background:' + dotColor + '"></div>' +
          escHtml(letters[oi] + '. ' + opt) +
          (isRight ? ' \u2713' : '') +
          (isUser && !isRight ? ' \u2717' : '') +
        '</div>';
    });

    reviewBody.innerHTML +=
      '<div class="review-item">' +
        '<div class="review-q">' + (qi + 1) + '. ' + escHtml(q.question) + '</div>' +
        answerHtml +
        '<div style="font-size:.73rem;color:var(--muted);margin-top:.4rem;font-style:italic">' + escHtml(q.reference) + '</div>' +
      '</div>';
  });
}

// ════════════════════════════════════════════════════════════
//  RETRY / NEW QUIZ
// ════════════════════════════════════════════════════════════
function retryQuiz() {
  currentQuestions = lastQuizPool.slice();
  currentIndex     = 0;
  score            = 0;
  categoryScores   = {};
  quizResults      = [];
  showScreen('question');
  showQuestion();
}

function newQuiz() {
  showScreen('start');
}

function toggleReview() {
  var body = document.getElementById('review-body');
  var icon = document.getElementById('review-icon');
  var isOpen = body.classList.toggle('open');
  icon.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
}
</script>
</body>
