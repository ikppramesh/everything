<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake · Everything</title>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;
  --border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --accent:#FA5D29;--nav-h:52px;
  --snake:#4ade80;--snake2:#22c55e;--food:#f87171;--food2:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding-top:var(--nav-h);overflow:hidden}
a{color:inherit;text-decoration:none}

/* NAV */
.ev-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;background:rgba(13,17,23,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:100}
.ev-nav-back{color:var(--muted);font-size:.82em;transition:color .2s}.ev-nav-back:hover{color:var(--text)}
.ev-nav-title{font-weight:700;font-size:.95rem;color:var(--text)}
.ev-nav-right{width:80px}

/* MAIN */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:.75rem}

/* HUD */
.hud{display:flex;gap:1.5rem;align-items:center;width:min(92vw,440px)}
.hud-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.45rem .85rem;flex:1;text-align:center}
.hud-label{font-size:.65em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hud-val{font-size:1.3em;font-weight:900;color:var(--text);line-height:1.2}
.hud-val.hi{color:var(--accent)}

/* CANVAS WRAPPER */
.canvas-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);box-shadow:0 0 0 1px rgba(250,93,41,.08),0 8px 32px rgba(0,0,0,.4)}
canvas{display:block;background:var(--bg2)}

/* OVERLAYS */
.c-overlay{position:absolute;inset:0;background:rgba(13,17,23,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;transition:opacity .25s}
.c-overlay.hidden{opacity:0;pointer-events:none}
.ol-emoji{font-size:3rem;line-height:1}
.ol-title{font-size:1.5rem;font-weight:900;color:var(--text);letter-spacing:-.03em}
.ol-sub{font-size:.85em;color:var(--muted);text-align:center;padding:0 1rem}
.ol-score{font-size:1.1em;font-weight:700;color:var(--accent)}
.btn{padding:.6rem 1.4rem;border-radius:8px;font-size:.88em;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}

/* D-PAD (mobile) */
.dpad{display:none;flex-direction:column;align-items:center;gap:4px;margin-top:.25rem}
@media(max-width:600px),(pointer:coarse){.dpad{display:flex}}
.dpad-row{display:flex;gap:4px}
.dpad-btn{width:52px;height:52px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-size:1.2em;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .1s;touch-action:manipulation}
.dpad-btn:active{background:var(--bg3);border-color:var(--accent)}

/* CONTROLS HINT */
.hint{font-size:.72em;color:var(--muted);text-align:center}
@media(max-width:600px){.hint{display:none}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<nav class="ev-nav">
  <a class="ev-nav-back" href="../../">← Everything</a>
  <span class="ev-nav-title">Snake</span>
  <div class="ev-nav-right"></div>
</nav>

<main>
  <div class="hud" id="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val" id="scoreEl">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Best</div>
      <div class="hud-val hi" id="bestEl">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Level</div>
      <div class="hud-val" id="levelEl">1</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="cvs"></canvas>

    <!-- Start overlay -->
    <div class="c-overlay" id="startOL">
      <div class="ol-emoji">🐍</div>
      <div class="ol-title">Snake</div>
      <div class="ol-sub">Eat the food, grow longer, don't hit walls or yourself.</div>
      <button class="btn btn-primary" onclick="startGame()">Start Game</button>
    </div>

    <!-- Game over overlay -->
    <div class="c-overlay hidden" id="gameOverOL">
      <div class="ol-emoji">💥</div>
      <div class="ol-title">Game Over</div>
      <div class="ol-score" id="finalScore">Score: 0</div>
      <div class="ol-sub" id="newBestMsg" style="display:none;color:var(--accent);font-weight:700">New High Score!</div>
      <button class="btn btn-primary" onclick="startGame()">Play Again</button>
    </div>

    <!-- Pause overlay -->
    <div class="c-overlay hidden" id="pauseOL">
      <div class="ol-emoji">⏸️</div>
      <div class="ol-title">Paused</div>
      <div class="ol-sub">Press Space or tap Resume to continue.</div>
      <button class="btn btn-primary" onclick="togglePause()">Resume</button>
    </div>
  </div>

  <!-- Mobile D-pad -->
  <div class="dpad" id="dpad">
    <div class="dpad-row">
      <div class="dpad-btn" ontouchstart="dpadPress('ArrowUp')" onclick="dpadPress('ArrowUp')">▲</div>
    </div>
    <div class="dpad-row">
      <div class="dpad-btn" ontouchstart="dpadPress('ArrowLeft')" onclick="dpadPress('ArrowLeft')">◀</div>
      <div class="dpad-btn" ontouchstart="dpadPress('ArrowDown')" onclick="dpadPress('ArrowDown')">▼</div>
      <div class="dpad-btn" ontouchstart="dpadPress('ArrowRight')" onclick="dpadPress('ArrowRight')">▶</div>
    </div>
  </div>

  <div class="hint">Arrow keys or WASD to move · Space to pause</div>
</main>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const GRID = 20; // cells
let CELL, W, H;

let snake, dir, nextDir, food, score, best, running, paused, loop;

// Speed: ms per tick. Level up every 5 points.
function getSpeed(sc) {
  const lv = Math.floor(sc / 5);
  return Math.max(80, 220 - lv * 18);
}
function getLevel(sc) { return Math.floor(sc / 5) + 1; }

function resize() {
  const wrap = document.getElementById('canvasWrap');
  const avail = Math.min(window.innerWidth * 0.95, window.innerHeight - 220, 440);
  const sz = Math.floor(avail / GRID) * GRID;
  CELL = sz / GRID;
  W = GRID; H = GRID;
  cvs.width = sz; cvs.height = sz;
  if (running && !paused) draw();
}

window.addEventListener('resize', resize);
resize();

best = parseInt(localStorage.getItem('snake_best') || '0');
document.getElementById('bestEl').textContent = best;

function startGame() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  running = true;
  paused = false;
  spawnFood();
  document.getElementById('startOL').classList.add('hidden');
  document.getElementById('gameOverOL').classList.add('hidden');
  document.getElementById('pauseOL').classList.add('hidden');
  updateHUD();
  clearTimeout(loop);
  tick();
}

function spawnFood() {
  const occupied = new Set(snake.map(s => s.x+','+s.y));
  let f;
  do { f = {x:Math.floor(Math.random()*W), y:Math.floor(Math.random()*H)}; }
  while (occupied.has(f.x+','+f.y));
  food = f;
}

function tick() {
  if (!running || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H) { gameOver(); return; }
  // Self collision
  if (snake.some(s => s.x===head.x && s.y===head.y)) { gameOver(); return; }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    spawnFood();
    updateHUD();
  } else {
    snake.pop();
  }
  draw();
  loop = setTimeout(tick, getSpeed(score));
}

function gameOver() {
  running = false;
  clearTimeout(loop);
  // Flash
  let fl = 0;
  const flashId = setInterval(() => {
    draw(fl % 2 === 0 ? 'red' : null);
    fl++;
    if (fl > 5) {
      clearInterval(flashId);
      showGameOver();
    }
  }, 80);
}

function showGameOver() {
  const newBest = score > best;
  if (newBest) { best = score; localStorage.setItem('snake_best', best); }
  document.getElementById('finalScore').textContent = 'Score: ' + score;
  document.getElementById('newBestMsg').style.display = newBest ? 'block' : 'none';
  document.getElementById('bestEl').textContent = best;
  document.getElementById('gameOverOL').classList.remove('hidden');
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  if (paused) {
    clearTimeout(loop);
    document.getElementById('pauseOL').classList.remove('hidden');
  } else {
    document.getElementById('pauseOL').classList.add('hidden');
    tick();
  }
}

function updateHUD() {
  document.getElementById('scoreEl').textContent = score;
  document.getElementById('bestEl').textContent = best;
  document.getElementById('levelEl').textContent = getLevel(score);
}

function draw(snakeColor) {
  const c = CELL;
  // Background grid
  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  // Subtle grid lines
  ctx.strokeStyle = 'rgba(48,54,61,.5)';
  ctx.lineWidth = .5;
  for (let i=0;i<=W;i++){
    ctx.beginPath();ctx.moveTo(i*c,0);ctx.lineTo(i*c,cvs.height);ctx.stroke();
  }
  for (let j=0;j<=H;j++){
    ctx.beginPath();ctx.moveTo(0,j*c);ctx.lineTo(cvs.width,j*c);ctx.stroke();
  }

  // Food
  const fr = food.x*c, ft = food.y*c;
  const gr = ctx.createRadialGradient(fr+c/2,ft+c/2,1,fr+c/2,ft+c/2,c/2);
  gr.addColorStop(0,'#fca5a5'); gr.addColorStop(1,'#ef4444');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.roundRect(fr+2, ft+2, c-4, c-4, 4);
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const sx = seg.x*c, sy = seg.y*c;
    const t = i / snake.length;
    if (snakeColor === 'red') {
      ctx.fillStyle = `hsl(${0}, 80%, ${50 - t*20}%)`;
    } else {
      const g = Math.round(173 - t * 80);
      ctx.fillStyle = `rgb(${34},${g},${60})`;
    }
    const r = i===0 ? 6 : 3;
    ctx.beginPath();
    ctx.roundRect(sx+1, sy+1, c-2, c-2, r);
    ctx.fill();

    // Head eyes
    if (i === 0) {
      ctx.fillStyle = '#fff';
      const ex = dir.x, ey = dir.y;
      const cx_ = sx + c/2, cy_ = sy + c/2;
      const perp1 = {x:-ey, y:ex};
      const e1x = cx_ + ex*c*.22 + perp1.x*c*.18;
      const e1y = cy_ + ey*c*.22 + perp1.y*c*.18;
      const e2x = cx_ + ex*c*.22 - perp1.x*c*.18;
      const e2y = cy_ + ey*c*.22 - perp1.y*c*.18;
      ctx.beginPath();ctx.arc(e1x,e1y,c*.1,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e2x,e2y,c*.1,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(e1x+ex*c*.03,e1y+ey*c*.03,c*.05,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e2x+ex*c*.03,e2y+ey*c*.03,c*.05,0,Math.PI*2);ctx.fill();
    }
  });
}

// Controls
const DIRS = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
  W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0},
};

document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); if (running) togglePause(); return; }
  const nd = DIRS[e.key];
  if (!nd) return;
  e.preventDefault();
  if (!running) return;
  // Prevent reversing
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
});

function dpadPress(key) {
  const nd = DIRS[key];
  if (!nd || !running) return;
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}

// Touch swipe
let tx0, ty0;
document.addEventListener('touchstart', e => { tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  if (tx0===undefined) return;
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if (Math.abs(dx)<10 && Math.abs(dy)<10) return;
  if (!running) return;
  let nd;
  if (Math.abs(dx)>Math.abs(dy)) nd = dx>0?DIRS.ArrowRight:DIRS.ArrowLeft;
  else nd = dy>0?DIRS.ArrowDown:DIRS.ArrowUp;
  if (nd.x===-dir.x && nd.y===-dir.y) return;
  nextDir = nd;
  tx0=ty0=undefined;
}, {passive:true});
</script>
</body>
</html>
