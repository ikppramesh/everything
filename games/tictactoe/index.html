<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe · Everything</title>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;
  --border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --accent:#FA5D29;--nav-h:52px;
  --x:#60a5fa;--o:#f472b6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding-top:var(--nav-h)}
a{color:inherit;text-decoration:none}

/* NAV */
.ev-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;background:rgba(13,17,23,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:100}
.ev-nav-back{color:var(--muted);font-size:.82em;transition:color .2s}.ev-nav-back:hover{color:var(--text)}
.ev-nav-title{font-weight:700;font-size:.95rem;color:var(--text)}
.ev-nav-right{width:80px}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:all}
.mode-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;max-width:420px;width:90%;text-align:center}
.mode-title{font-size:1.6rem;font-weight:900;color:var(--text);margin-bottom:.4rem;letter-spacing:-.03em}
.mode-sub{color:var(--muted);font-size:.9em;margin-bottom:2rem}
.mode-btns{display:flex;flex-direction:column;gap:.75rem}
.mode-btn{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.5rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:1rem;transition:border-color .2s,background .2s}
.mode-btn:hover{border-color:var(--accent);background:rgba(250,93,41,.06)}
.mode-icon{font-size:1.6em;flex-shrink:0}
.mode-label{font-size:1em;font-weight:700;color:var(--text);display:block}
.mode-desc{font-size:.78em;color:var(--muted);display:block;margin-top:.15rem}

/* MAIN LAYOUT */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem;gap:1.5rem}

/* STATUS */
.status-bar{display:flex;align-items:center;gap:.75rem;font-size:1em;font-weight:600;color:var(--text);min-height:2rem}
.turn-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot-x{background:var(--x)}
.dot-o{background:var(--o)}
.status-msg{font-size:.95em}

/* BOARD */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(72vw,360px)}
.cell{aspect-ratio:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:clamp(2rem,10vw,4rem);font-weight:900;transition:background .15s,border-color .15s;user-select:none;-webkit-user-select:none}
.cell:hover:not(.taken){border-color:var(--accent);background:rgba(250,93,41,.05)}
.cell.taken{cursor:default}
.cell.x{color:var(--x)}
.cell.o{color:var(--o)}
.cell.win-cell{background:rgba(250,93,41,.15);border-color:var(--accent)}

/* SCORE */
.scoreboard{display:flex;gap:1rem;align-items:center}
.score-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:.6rem 1.1rem;text-align:center;min-width:70px}
.score-label{font-size:.7em;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.score-val{font-size:1.5em;font-weight:900;line-height:1.1}
.score-val.x{color:var(--x)}
.score-val.o{color:var(--o)}
.score-val.draw{color:var(--muted)}
.score-sep{color:var(--border);font-size:1.5em}

/* ACTIONS */
.actions{display:flex;gap:.75rem}
.btn{padding:.55rem 1.2rem;border-radius:8px;font-size:.85em;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{border-color:var(--text);color:var(--text)}

/* WIN OVERLAY */
.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.win-overlay.show{opacity:1;pointer-events:all}
.win-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;max-width:380px;width:90%;text-align:center}
.win-emoji{font-size:3rem;margin-bottom:.75rem}
.win-title{font-size:1.5rem;font-weight:900;color:var(--text);margin-bottom:.4rem}
.win-sub{color:var(--muted);font-size:.9em;margin-bottom:1.75rem}
.win-actions{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<nav class="ev-nav">
  <a class="ev-nav-back" href="../../">← Everything</a>
  <span class="ev-nav-title">Tic-Tac-Toe</span>
  <div class="ev-nav-right"></div>
</nav>

<!-- Mode selection -->
<div class="overlay on" id="modeOverlay">
  <div class="mode-box">
    <div class="mode-title">Tic-Tac-Toe</div>
    <div class="mode-sub">Choose your game mode</div>
    <div class="mode-btns">
      <button class="mode-btn" onclick="startGame('ai')">
        <span class="mode-icon">🤖</span>
        <div>
          <span class="mode-label">vs Computer</span>
          <span class="mode-desc">You play X · AI plays O (unbeatable)</span>
        </div>
      </button>
      <button class="mode-btn" onclick="startGame('2p')">
        <span class="mode-icon">👥</span>
        <div>
          <span class="mode-label">Two Players</span>
          <span class="mode-desc">Pass-and-play on same device</span>
        </div>
      </button>
    </div>
  </div>
</div>

<!-- Win overlay -->
<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji" id="winEmoji">🎉</div>
    <div class="win-title" id="winTitle">X Wins!</div>
    <div class="win-sub" id="winSub">Well played!</div>
    <div class="win-actions">
      <button class="btn btn-primary" onclick="nextRound()">Play Again</button>
      <button class="btn btn-ghost" onclick="changeMode()">Change Mode</button>
    </div>
  </div>
</div>

<main>
  <div class="status-bar">
    <div class="turn-dot dot-x" id="turnDot"></div>
    <span class="status-msg" id="statusMsg">X's turn</span>
  </div>

  <div class="board" id="board">
    <div class="cell" data-i="0" onclick="cellClick(0)"></div>
    <div class="cell" data-i="1" onclick="cellClick(1)"></div>
    <div class="cell" data-i="2" onclick="cellClick(2)"></div>
    <div class="cell" data-i="3" onclick="cellClick(3)"></div>
    <div class="cell" data-i="4" onclick="cellClick(4)"></div>
    <div class="cell" data-i="5" onclick="cellClick(5)"></div>
    <div class="cell" data-i="6" onclick="cellClick(6)"></div>
    <div class="cell" data-i="7" onclick="cellClick(7)"></div>
    <div class="cell" data-i="8" onclick="cellClick(8)"></div>
  </div>

  <div class="scoreboard">
    <div class="score-box">
      <div class="score-label" id="p1Label">X (You)</div>
      <div class="score-val x" id="scoreX">0</div>
    </div>
    <div class="score-sep">·</div>
    <div class="score-box">
      <div class="score-label">Draws</div>
      <div class="score-val draw" id="scoreDraw">0</div>
    </div>
    <div class="score-sep">·</div>
    <div class="score-box">
      <div class="score-label" id="p2Label">O (AI)</div>
      <div class="score-val o" id="scoreO">0</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="nextRound()">New Game</button>
    <button class="btn btn-ghost" onclick="changeMode()">Change Mode</button>
  </div>
</main>

<script>
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board, turn, gameMode, locked;
let scores = {X:0, O:0, D:0};

function startGame(mode) {
  gameMode = mode;
  document.getElementById('modeOverlay').classList.remove('on');
  document.getElementById('p1Label').textContent = mode === 'ai' ? 'X (You)' : 'X';
  document.getElementById('p2Label').textContent = mode === 'ai' ? 'O (AI)' : 'O';
  initBoard();
}

function changeMode() {
  document.getElementById('winOverlay').classList.remove('show');
  scores = {X:0, O:0, D:0};
  updateScores();
  document.getElementById('modeOverlay').classList.add('on');
}

function initBoard() {
  board = Array(9).fill(null);
  turn = 'X';
  locked = false;
  document.getElementById('winOverlay').classList.remove('show');
  render();
}

function nextRound() {
  document.getElementById('winOverlay').classList.remove('show');
  initBoard();
}

function render() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach((c, i) => {
    c.textContent = board[i] || '';
    c.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
  });
  const dot = document.getElementById('turnDot');
  dot.className = 'turn-dot dot-' + turn.toLowerCase();
  const label = gameMode === 'ai'
    ? (turn === 'X' ? "Your turn (X)" : "Computer thinking…")
    : (turn + "'s turn");
  document.getElementById('statusMsg').textContent = locked ? '' : label;
}

function cellClick(i) {
  if (locked || board[i]) return;
  board[i] = turn;
  const result = checkResult();
  if (result) { finishGame(result); return; }
  turn = turn === 'X' ? 'O' : 'X';
  render();
  if (gameMode === 'ai' && turn === 'O') {
    locked = true;
    render();
    setTimeout(() => {
      aiMove();
      locked = false;
      const r2 = checkResult();
      if (r2) { finishGame(r2); return; }
      turn = 'X';
      render();
    }, 220);
  }
}

function aiMove() {
  const bm = bestMove(board);
  if (bm !== -1) board[bm] = 'O';
}

/* Minimax — O is maximiser */
function minimax(b, isMax) {
  const r = checkBoard(b);
  if (r === 'X') return -10;
  if (r === 'O') return 10;
  if (r === 'draw') return 0;
  const empties = b.map((v,i)=>v?null:i).filter(v=>v!==null);
  if (isMax) {
    let best = -Infinity;
    for (const i of empties) {
      b[i] = 'O'; best = Math.max(best, minimax(b, false)); b[i] = null;
    }
    return best;
  } else {
    let best = Infinity;
    for (const i of empties) {
      b[i] = 'X'; best = Math.min(best, minimax(b, true)); b[i] = null;
    }
    return best;
  }
}

function bestMove(b) {
  let best = -Infinity, move = -1;
  b.forEach((v, i) => {
    if (v) return;
    b[i] = 'O';
    const s = minimax(b, false);
    b[i] = null;
    if (s > best) { best = s; move = i; }
  });
  return move;
}

function checkBoard(b) {
  for (const [a,x,c] of WINS) {
    if (b[a] && b[a]===b[x] && b[x]===b[c]) return b[a];
  }
  if (b.every(v=>v)) return 'draw';
  return null;
}

function checkResult() {
  for (const line of WINS) {
    const [a,x,c] = line;
    if (board[a] && board[a]===board[x] && board[x]===board[c]) return {winner:board[a], line};
  }
  if (board.every(v=>v)) return {winner:null, line:null};
  return null;
}

function finishGame(result) {
  locked = true;
  render();
  if (result.line) {
    result.line.forEach(i => {
      document.querySelectorAll('.cell')[i].classList.add('win-cell');
    });
  }
  setTimeout(() => showWin(result), 700);
}

function showWin(result) {
  let emoji, title, sub;
  if (!result.winner) {
    emoji = '🤝'; title = "It's a Draw!";
    sub = 'Great game — perfectly matched!';
    scores.D++;
  } else if (result.winner === 'X') {
    if (gameMode === 'ai') {
      emoji = '🎉'; title = 'You Win!'; sub = 'You beat the AI — impressive!';
    } else {
      emoji = '🏆'; title = 'X Wins!'; sub = 'Congratulations!';
    }
    scores.X++;
  } else {
    if (gameMode === 'ai') {
      emoji = '🤖'; title = 'AI Wins!'; sub = 'The computer is unbeatable — try again!';
    } else {
      emoji = '🏆'; title = 'O Wins!'; sub = 'Congratulations!';
    }
    scores.O++;
  }
  document.getElementById('winEmoji').textContent = emoji;
  document.getElementById('winTitle').textContent = title;
  document.getElementById('winSub').textContent = sub;
  updateScores();
  document.getElementById('winOverlay').classList.add('show');
}

function updateScores() {
  document.getElementById('scoreX').textContent = scores.X;
  document.getElementById('scoreO').textContent = scores.O;
  document.getElementById('scoreDraw').textContent = scores.D;
}
</script>
</body>
</html>
